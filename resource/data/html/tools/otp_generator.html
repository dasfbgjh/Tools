<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP 代码生成器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .otp-display {
            text-align: center;
            padding: 1.25rem 0.5rem;
        }

        .otp-code {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.35em;
            color: var(--primary);
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem 0.75rem 1.35rem;
            display: inline-block;
            user-select: all;
            min-width: 200px;
        }

        .otp-code.empty {
            color: var(--text-light);
            font-style: italic;
            letter-spacing: normal;
            font-size: 1rem;
            font-weight: 400;
        }

        .otp-countdown {
            margin-top: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .otp-progress {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .otp-progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.3s linear, background-color 0.3s;
        }

        .otp-progress-fill.warn {
            background: #f59e0b;
        }

        .otp-progress-fill.danger {
            background: #ef4444;
        }

        .otp-seconds {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-weight: 600;
            min-width: 3rem;
            text-align: right;
            color: var(--text);
        }

        .otp-uri {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.8125rem;
            color: var(--text);
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem 1rem;
            word-break: break-all;
            min-height: 40px;
        }

        .otp-verify-result {
            font-size: 0.875rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .otp-verify-result.ok { color: #16a34a; }
        .otp-verify-result.fail { color: #dc2626; }

        .otp-field-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }

        .otp-field-row .tool-input { flex: 1; }

        .otp-counter-row[hidden] { display: none !important; }
    </style>
</head>

<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <div class="tool-grid-2">
                <div>
                    <h2>配置选项</h2>

                    <label class="tool-label" for="secret">密钥（Base32 编码）</label>
                    <div class="otp-field-row">
                        <input type="text" id="secret" class="tool-input" placeholder="例如 JBSWY3DPEHPK3PXP" autocomplete="off" spellcheck="false">
                        <button id="btn-gen-key" class="btn btn-outline btn-sm" type="button" title="生成随机密钥">🎲 生成</button>
                    </div>
                    <p class="tool-hint">支持带空格、小写；默认算法 SHA-1，兼容 Google Authenticator</p>

                    <div class="tool-grid-2" style="margin-top:0.75rem; gap:0.75rem;">
                        <div>
                            <label class="tool-label" for="mode">模式</label>
                            <select id="mode" class="tool-select">
                                <option value="totp" selected>TOTP（基于时间）</option>
                                <option value="hotp">HOTP（基于计数器）</option>
                            </select>
                        </div>
                        <div>
                            <label class="tool-label" for="algorithm">算法</label>
                            <select id="algorithm" class="tool-select">
                                <option value="SHA-1" selected>SHA-1</option>
                                <option value="SHA-256">SHA-256</option>
                                <option value="SHA-512">SHA-512</option>
                            </select>
                        </div>
                    </div>

                    <div class="tool-grid-2" style="margin-top:0.75rem; gap:0.75rem;">
                        <div>
                            <label class="tool-label" for="digits">数字位数</label>
                            <select id="digits" class="tool-select">
                                <option value="6" selected>6 位</option>
                                <option value="7">7 位</option>
                                <option value="8">8 位</option>
                            </select>
                        </div>
                        <div>
                            <label class="tool-label" for="period">时间步长（秒）</label>
                            <input type="number" id="period" class="tool-input" value="30" min="1" max="600">
                        </div>
                    </div>

                    <div id="counter-row" class="otp-counter-row" style="margin-top:0.75rem;">
                        <label class="tool-label" for="counter">计数器值</label>
                        <div class="otp-field-row">
                            <input type="number" id="counter" class="tool-input" value="0" min="0">
                            <button id="btn-inc-counter" class="btn btn-outline btn-sm" type="button" title="计数器 +1">+1</button>
                        </div>
                    </div>

                    <div class="tool-grid-2" style="margin-top:0.75rem; gap:0.75rem;">
                        <div>
                            <label class="tool-label" for="issuer">发行方（可选）</label>
                            <input type="text" id="issuer" class="tool-input" placeholder="例如 MyService" autocomplete="off">
                        </div>
                        <div>
                            <label class="tool-label" for="label">标签（可选）</label>
                            <input type="text" id="label" class="tool-input" placeholder="例如 user@example.com" autocomplete="off">
                        </div>
                    </div>
                </div>

                <div>
                    <h2>当前 OTP</h2>
                    <div class="otp-display">
                        <div id="otp-code" class="otp-code empty">请输入密钥</div>
                        <div id="totp-countdown" class="otp-countdown">
                            <div class="otp-progress">
                                <div id="otp-progress-fill" class="otp-progress-fill" style="width:0%;"></div>
                            </div>
                            <span id="otp-seconds" class="otp-seconds">—</span>
                        </div>
                    </div>

                    <div class="tool-toolbar" style="margin-top:0.5rem; justify-content:center;">
                        <button id="btn-copy-otp" class="btn btn-sm" type="button">复制 OTP</button>
                        <button id="btn-refresh" class="btn btn-outline btn-sm" type="button">立即刷新</button>
                    </div>

                    <div style="margin-top:1.25rem;">
                        <label class="tool-label">otpauth:// URI</label>
                        <div id="otp-uri" class="otp-uri">—</div>
                        <div class="tool-toolbar" style="margin-top:0.5rem;">
                            <button id="btn-copy-uri" class="btn btn-ghost btn-sm" type="button">复制 URI</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>验证 OTP</h2>
            <p class="tool-hint" style="margin-top:-0.5rem;">输入待验证的 OTP 码，与当前配置比对。TOTP 模式允许 ±1 步长时钟偏差。</p>
            <div class="otp-field-row">
                <input type="text" id="verify-input" class="tool-input" placeholder="输入要验证的 OTP 码" autocomplete="off" spellcheck="false" inputmode="numeric">
                <button id="btn-verify" class="btn btn-sm" type="button">验证</button>
            </div>
            <div id="verify-result" class="otp-verify-result"></div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>说明</h2>
            <ul class="tool-result-list">
                <li><span class="label">TOTP</span><span class="value">基于时间，当前时间戳 / 步长 = 计数器，自动刷新</span></li>
                <li><span class="label">HOTP</span><span class="value">基于计数器，使用指定计数器值生成，需手动递增</span></li>
                <li><span class="label">算法</span><span class="value">使用 Web Crypto API 实现 HMAC-SHA1/256/512</span></li>
                <li><span class="label">密钥</span><span class="value">Base32 编码（RFC 4648），支持空格与小写</span></li>
                <li><span class="label">安全</span><span class="value">所有计算在浏览器本地完成，不上传任何数据</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./otp_generator.js"></script>
</body>

</html>
