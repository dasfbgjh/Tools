<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百分比计算器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./percentage_calculator.css">
</head>

<body>
    <div class="tool-page">

        <div class="tool-grid-2">
            <div class="tool-card">
                <h2>X% of Y 是多少</h2>
                <div class="pct-input-row">
                    <input type="number" id="m1-x" class="tool-input" placeholder="百分比" step="any" value="15">
                    <span class="pct-sep">% 的</span>
                    <input type="number" id="m1-y" class="tool-input" placeholder="数值" step="any" value="200">
                    <span class="pct-sep">=</span>
                </div>
                <div class="pct-result" id="m1-result">30</div>
            </div>

            <div class="tool-card">
                <h2>X 是 Y 的百分之几</h2>
                <div class="pct-input-row">
                    <input type="number" id="m2-x" class="tool-input" placeholder="数值 X" step="any" value="30">
                    <span class="pct-sep">是</span>
                    <input type="number" id="m2-y" class="tool-input" placeholder="数值 Y" step="any" value="200">
                    <span class="pct-sep">的</span>
                </div>
                <div class="pct-result" id="m2-result">15%</div>
            </div>

            <div class="tool-card">
                <h2>从 X 到 Y 的增减幅度</h2>
                <div class="pct-input-row">
                    <span class="pct-sep">从</span>
                    <input type="number" id="m3-x" class="tool-input" placeholder="原值" step="any" value="100">
                    <span class="pct-sep">到</span>
                    <input type="number" id="m3-y" class="tool-input" placeholder="新值" step="any" value="150">
                </div>
                <div class="pct-result" id="m3-result">+50%</div>
            </div>

            <div class="tool-card">
                <h2>累加/连乘百分比</h2>
                <div class="pct-input-row">
                    <input type="number" id="m4-base" class="tool-input" placeholder="基数" step="any" value="1000">
                    <span class="pct-sep">依次增减</span>
                </div>
                <input type="text" id="m4-rates" class="tool-input tool-monospace" placeholder="10%, -5%, 20%" value="10%, -5%, 20%" style="margin-top:0.5rem;">
                <div class="pct-result" id="m4-result">1247.00</div>
                <p class="tool-hint">逗号分隔，正数表示增加，负数表示减少</p>
            </div>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./percentage_calculator.js"></script>
</body>

</html>
