<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片OCR识别</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./image_ocr.css">
</head>

<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <!-- 图片预览 -->
            <div class="upload-preview ocr-upload" id="drop-zone">
                <div class="preview-empty" id="preview-empty">
                    <div class="ocr-drop-icons">
                        <div class="ocr-drop-icon-ring"></div>
                        <div class="ocr-drop-icon-inner">
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                                class="ocr-drop-svg">
                                <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </div>
                    </div>
                    <div class="ocr-drop-text">
                        <span class="ocr-drop-title">拖拽图片到此处 或 点击选择文件</span>
                        <span class="ocr-drop-sub">选择图片后在图片上点击可显示选区</span>
                        <span class="ocr-drop-hint">
                            <span class="ocr-drop-chip">PNG</span>
                            <span class="ocr-drop-chip">JPG</span>
                            <span class="ocr-drop-chip">BMP</span>
                            <span class="ocr-drop-chip">WEBP</span>
                            <span class="ocr-drop-size">· 最大 20MB</span>
                        </span>
                    </div>
                </div>
                <div class="preview-image-wrap" id="preview-wrap">
                    <div class="ocr-img-stage" id="ocr-img-stage">
                        <img class="ocr-preview-img" id="ocr-preview-img" alt="预览">
                        <!-- OCR 文本块高亮 -->
                        <svg class="ocr-box-overlay" id="ocr-box-overlay" xmlns="http://www.w3.org/2000/svg"
                            preserveAspectRatio="none"></svg>
                        <div class="ocr-box-layer" id="ocr-box-layer"></div>
                        <!-- 选区：遮罩 + 挖空区域 + 8 手柄 -->
                        <svg class="ocr-crop-overlay" id="ocr-crop-overlay" xmlns="http://www.w3.org/2000/svg"
                            preserveAspectRatio="none">
                            <defs>
                                <mask id="ocr-crop-mask">
                                    <rect class="ocr-crop-mask-bg" x="0" y="0" width="100%" height="100%"
                                        fill="white" />
                                    <rect class="ocr-crop-mask-hole" id="ocr-crop-mask-hole" fill="black" />
                                </mask>
                            </defs>
                            <rect class="ocr-crop-shadow" x="0" y="0" width="100%" height="100%"
                                mask="url(#ocr-crop-mask)" />
                            <rect class="ocr-crop-frame" id="ocr-crop-frame" />
                            <!-- 8 个手柄 + 4 条边（拖动移动） -->
                            <rect class="ocr-crop-move-area" id="ocr-crop-move-area" fill="transparent" />
                            <rect class="ocr-crop-handle" data-handle="nw" />
                            <rect class="ocr-crop-handle" data-handle="n" />
                            <rect class="ocr-crop-handle" data-handle="ne" />
                            <rect class="ocr-crop-handle" data-handle="e" />
                            <rect class="ocr-crop-handle" data-handle="se" />
                            <rect class="ocr-crop-handle" data-handle="s" />
                            <rect class="ocr-crop-handle" data-handle="sw" />
                            <rect class="ocr-crop-handle" data-handle="w" />
                        </svg>
                    </div>
                </div>
                <input type="file" id="file-input" accept="image/*">
            </div>

            <!-- 参数 + 提交按钮 -->
            <div class="ocr-options-panel">
                <div class="ocr-params-row ocr-params-row-flex">
                    <div class="ocr-param-item">
                        <label class="ocr-param-label">识别模型</label>
                        <select id="param-model" class="select ocr-param-select">
                            <option value="">加载中…</option>
                        </select>
                    </div>
                    <div class="ocr-param-item">
                        <label class="ocr-param-label">最大边长</label>
                        <input type="number" id="param-maxSideLen" value="1024" min="32" max="4096" step="32"
                            class="ocr-param-number">
                    </div>
                    <div class="ocr-param-item">
                        <label class="ocr-param-label">方向检测</label>
                        <label class="ocr-checkbox ocr-checkbox-inline">
                            <input type="checkbox" id="param-doAngle" checked>
                            <span>启用文字方向矫正</span>
                        </label>
                    </div>
                    <div class="ocr-param-item ocr-param-item-spacer"></div>
                    <div class="ocr-param-item ocr-param-actions">
                        <button type="button" class="btn btn-sm btn-outline" id="ocr-reupload-btn"> 更换图片 </button>
                        <button type="button" class="btn btn-sm btn-outline" id="btn-reset-crop">重置选区</button>
                        <button type="button" class="btn btn-sm btn-outline" id="btn-clear">清空</button>
                        <button type="button" class="btn btn-primary" id="btn-ocr" disabled>
                            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="15"
                                height="15" style="margin-right:6px;vertical-align:-3px;">
                                <path
                                    d="M4 7C4 5.89543 4.89543 5 6 5H18C19.1046 5 20 5.89543 20 7V17C20 18.1046 19.1046 19 18 19H6C4.89543 19 4 18.1046 4 17V7Z"
                                    stroke="currentColor" stroke-width="2" />
                                <path d="M8 10H16M8 14H14" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" />
                            </svg>
                            <span id="btn-ocr-text">开始识别</span>
                        </button>
                    </div>
                </div>
                <div class="ocr-params-row ocr-params-row-2col">
                    <div class="ocr-param-item">
                        <label class="ocr-param-label">检测阈值 <span id="param-boxScoreThresh-val"
                                class="ocr-param-val">0.50</span></label>
                        <input type="range" id="param-boxScoreThresh" min="0.1" max="0.9" step="0.05" value="0.5">
                    </div>
                    <div class="ocr-param-item">
                        <label class="ocr-param-label">文本扩展比例 <span id="param-unClipRatio-val"
                                class="ocr-param-val">1.60</span></label>
                        <input type="range" id="param-unClipRatio" min="0.5" max="4.0" step="0.1" value="1.6">
                    </div>
                </div>
            </div>

            <!-- 识别结果 -->
            <div style="margin-top:1rem;">
                <label class="tool-label">识别结果</label>
                <div class="ocr-result-area" id="result-area">
                    <div class="ocr-result-empty" id="result-empty">
                        <span>上传图片后点击「开始识别」</span>
                    </div>
                    <div class="ocr-result-content" id="result-content" style="display:none;">
                        <div class="ocr-stats" id="ocr-stats"></div>
                        <div class="ocr-toolbar">
                            <button class="btn btn-sm" id="btn-copy-text">复制全部文本</button>
                            <button class="btn btn-sm btn-outline" id="btn-download-text">下载TXT</button>
                            <span class="spacer"></span>
                            <span class="ocr-block-count" id="block-count"></span>
                        </div>
                        <div class="ocr-fulltext" id="ocr-fulltext"></div>
                        <label class="tool-label" style="margin-top:1rem;">文本块详情</label>
                        <div class="ocr-blocks" id="ocr-blocks"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./image_ocr.js"></script>
</body>

</html>
