<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户代理解析器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .ua-display {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.8125rem;
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.75rem;
            word-break: break-all;
            color: var(--text);
            line-height: 1.6;
        }
        .device-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8125rem;
            font-weight: 600;
            background: var(--primary-light);
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <div class="tool-toolbar">
                <button class="btn btn-sm" id="btn-current">使用当前浏览器</button>
                <span class="spacer"></span>
                <button class="btn btn-outline btn-sm" id="btn-copy-ua">复制 UA</button>
            </div>

            <label class="tool-label" for="ua-input">User-Agent 字符串</label>
            <textarea id="ua-input" class="tool-textarea sm" placeholder="输入 User-Agent 字符串进行解析..."></textarea>
            <p class="tool-hint">点击「使用当前浏览器」自动填入，或粘贴 UA 手动解析</p>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>解析结果</h2>
            <ul class="tool-result-list">
                <li><span class="label">浏览器</span><span class="value" id="r-browser">—</span></li>
                <li><span class="label">浏览器版本</span><span class="value" id="r-browser-ver">—</span></li>
                <li><span class="label">渲染引擎</span><span class="value" id="r-engine">—</span></li>
                <li><span class="label">引擎版本</span><span class="value" id="r-engine-ver">—</span></li>
                <li><span class="label">操作系统</span><span class="value" id="r-os">—</span></li>
                <li><span class="label">OS 版本</span><span class="value" id="r-os-ver">—</span></li>
                <li><span class="label">CPU 架构</span><span class="value" id="r-arch">—</span></li>
                <li><span class="label">设备类型</span><span class="value" id="r-device">—</span></li>
            </ul>
            <div id="device-badge-wrap" style="margin-top:0.75rem; display:none;">
                <span class="device-badge" id="device-badge"></span>
            </div>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./user_agent_parser.js"></script>
</body>
</html>
