<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 所见即所得编辑器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./html_wysiwyg_editor.css">
</head>

<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <div class="wysiwyg-toolbar">
                <div class="wysiwyg-btn-group">
                    <button type="button" class="wysiwyg-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
                    <button type="button" class="wysiwyg-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
                    <button type="button" class="wysiwyg-btn" data-cmd="underline"
                        title="下划线 (Ctrl+U)"><u>U</u></button>
                    <button type="button" class="wysiwyg-btn" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <select id="font-size" class="wysiwyg-select" title="字体大小">
                        <option value="">字号</option>
                        <option value="1">小</option>
                        <option value="2">较小</option>
                        <option value="3" selected>普通</option>
                        <option value="4">较大</option>
                        <option value="5">大</option>
                        <option value="6">很大</option>
                        <option value="7">最大</option>
                    </select>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <label class="wysiwyg-color-btn" title="文字颜色">
                        <span class="color-icon">A</span>
                        <input type="color" id="text-color" value="#000000">
                    </label>
                    <label class="wysiwyg-color-btn" title="背景色">
                        <span class="color-icon bg">H</span>
                        <input type="color" id="bg-color" value="#ffff00">
                    </label>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <button type="button" class="wysiwyg-btn" data-cmd="justifyLeft" title="左对齐">⬅</button>
                    <button type="button" class="wysiwyg-btn" data-cmd="justifyCenter" title="居中">↔</button>
                    <button type="button" class="wysiwyg-btn" data-cmd="justifyRight" title="右对齐">➡</button>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <button type="button" class="wysiwyg-btn" data-cmd="insertOrderedList" title="有序列表">1.</button>
                    <button type="button" class="wysiwyg-btn" data-cmd="insertUnorderedList" title="无序列表">•</button>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <button type="button" class="wysiwyg-btn" id="btn-link" title="插入链接">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
                        </svg>
                    </button>
                    <button type="button" class="wysiwyg-btn" id="btn-image" title="插入图片">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                            <circle cx="8.5" cy="8.5" r="1.5" />
                            <path d="M21 15l-5-5L5 21" />
                        </svg>
                    </button>
                </div>

                <div class="wysiwyg-divider"></div>

                <div class="wysiwyg-btn-group">
                    <button type="button" class="wysiwyg-btn" data-cmd="removeFormat" title="清除格式">✕</button>
                    <button type="button" class="wysiwyg-btn" data-cmd="undo" title="撤销 (Ctrl+Z)">↶</button>
                    <button type="button" class="wysiwyg-btn" data-cmd="redo" title="重做 (Ctrl+Y)">↷</button>
                </div>

                <span class="spacer"></span>

                <div class="wysiwyg-btn-group">
                    <button type="button" class="btn btn-outline btn-sm" id="btn-toggle-view">查看 HTML 源码</button>
                </div>
            </div>

            <div id="editor-wrap" class="wysiwyg-editor-wrap">
                <div id="editor" class="wysiwyg-editor" contenteditable="true" spellcheck="false"></div>
                <textarea id="html-source" class="wysiwyg-source" hidden spellcheck="false"></textarea>
            </div>

            <div class="tool-toolbar" style="margin-top:0.75rem; margin-bottom:0;">
                <button id="btn-export" class="btn btn-sm" type="button">导出 HTML</button>
                <button id="btn-copy" class="btn btn-outline btn-sm" type="button">复制 HTML</button>
                <button id="btn-clear" class="btn btn-ghost btn-sm" type="button">清空内容</button>
                <span class="spacer"></span>
                <span id="char-count" class="wysiwyg-stat">0 字符</span>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>说明</h2>
            <ul class="tool-result-list">
                <li><span class="label">编辑</span><span class="value">使用 contenteditable 实现可视化富文本编辑</span></li>
                <li><span class="label">格式化</span><span class="value">基于 document.execCommand，浏览器仍支持（已废弃但可用）</span></li>
                <li><span class="label">视图</span><span class="value">可在可视化编辑与 HTML 源码之间切换，源码可双向同步</span></li>
                <li><span class="label">快捷键</span><span class="value">Ctrl+B 加粗 / Ctrl+I 斜体 / Ctrl+U 下划线 / Ctrl+Z
                        撤销</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./html_wysiwyg_editor.js"></script>
</body>

</html>
