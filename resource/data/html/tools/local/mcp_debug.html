<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 调试器</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./mcp_debug.css">
</head>

<body>
    <div class="tool-page md-page" data-no-header>
        <div class="md-layout">
            <!-- ============ 左侧：连接 + 功能标签 ============ -->
            <aside class="md-panel md-form">
                <div class="md-panel-title"><span>连接与功能</span></div>

                <!-- 连接栏 -->
                <div class="md-conn">
                    <div class="ui-form-row">
                        <label class="ui-form-label" style="width:72px;flex:0 0 72px;">传输</label>
                        <select class="ui-form-input" id="f-transport" style="flex:1;">
                            <option value="auto">auto（Streamable HTTP）</option>
                            <option value="sse">sse（旧版 SSE）</option>
                            <option value="stdio">stdio（子进程）</option>
                        </select>
                        <label class="ui-form-label" style="width:48px;flex:0 0 48px;margin-left:0.5rem;">超时</label>
                        <input type="number" class="ui-form-input sm" id="f-timeout" min="1" max="600" value="30"
                            style="width:72px;flex:0 0 72px;">
                    </div>
                    <div class="ui-form-row" id="row-endpoint">
                        <label class="ui-form-label" style="width:72px;flex:0 0 72px;">目标端点</label>
                        <input type="text" class="ui-form-input" id="f-endpoint"
                            placeholder="http://127.0.0.1:8080/mcp" style="flex:1;">
                    </div>
                    <div class="ui-form-row" id="row-command" style="display:none;">
                        <label class="ui-form-label" style="width:72px;flex:0 0 72px;">命令</label>
                        <input type="text" class="ui-form-input" id="f-command"
                            placeholder="npx @modelcontextprotocol/server-everything" style="flex:1;">
                    </div>
                    <div class="ui-form-row" id="row-env" style="display:none;">
                        <label class="ui-form-label" style="width:72px;flex:0 0 72px;">环境变量</label>
                        <input type="text" class="ui-form-input" id="f-env"
                            placeholder="KEY1=val1, KEY2=val2" style="flex:1;">
                    </div>

                    <!-- 握手参数 -->
                    <details class="md-details">
                        <summary>握手与客户端参数</summary>
                        <div class="md-details-body">
                            <div class="ui-form-row">
                                <label class="ui-form-label" style="width:88px;flex:0 0 88px;">协议版本</label>
                                <input type="text" class="ui-form-input" id="f-proto" value="2025-03-26" style="flex:1;">
                            </div>
                            <div class="ui-form-row">
                                <label class="ui-form-label" style="width:88px;flex:0 0 88px;">客户端名</label>
                                <input type="text" class="ui-form-input" id="f-client-name"
                                    value="MCP-Debug-Tool-WebUI" style="flex:1;">
                            </div>
                            <div class="ui-form-row">
                                <label class="ui-form-label" style="width:88px;flex:0 0 88px;">客户端版本</label>
                                <input type="text" class="ui-form-input" id="f-client-version" value="1.0"
                                    style="flex:1;">
                            </div>
                            <label class="ui-toggle" style="margin-top:0.25rem;">
                                <input type="checkbox" id="f-skip-handshake">
                                <span>跳过握手（仅对枚举/调用动作生效）</span>
                            </label>
                        </div>
                    </details>

                    <div class="md-conn-actions">
                        <button class="btn btn-primary btn-sm" id="btn-connect" type="button">⚡ 连接并加载</button>
                        <button class="btn btn-outline btn-sm" id="btn-ping" type="button">ping</button>
                        <span class="spacer"></span>
                        <span id="conn-status" class="md-conn-status"></span>
                    </div>
                </div>

                <!-- 标签栏 -->
                <div class="md-tabs" id="md-tabs">
                    <button class="md-tab active" data-tab="tools" type="button">工具<span class="md-tab-cnt"
                            id="cnt-tools">0</span></button>
                    <button class="md-tab" data-tab="resources" type="button">资源<span class="md-tab-cnt"
                            id="cnt-resources">0</span></button>
                    <button class="md-tab" data-tab="prompts" type="button">提示词<span class="md-tab-cnt"
                            id="cnt-prompts">0</span></button>
                    <button class="md-tab" data-tab="raw" type="button">原始请求</button>
                </div>

                <!-- 标签内容 -->
                <div class="md-tab-body">
                    <!-- 工具 -->
                    <div class="md-tab-pane active" data-tab="tools">
                        <div class="md-tab-toolbar">
                            <button class="btn btn-outline btn-sm" id="btn-refresh-tools" type="button">↻ 刷新工具</button>
                            <input type="text" class="ui-form-input md-filter" id="f-tool-filter"
                                placeholder="过滤工具名…" style="flex:1;">
                        </div>
                        <div id="tool-list" class="md-item-list"></div>
                    </div>
                    <!-- 资源 -->
                    <div class="md-tab-pane" data-tab="resources">
                        <div class="md-tab-toolbar">
                            <button class="btn btn-outline btn-sm" id="btn-refresh-resources"
                                type="button">↻ 刷新资源</button>
                        </div>
                        <div id="resource-list" class="md-item-list"></div>
                    </div>
                    <!-- 提示词 -->
                    <div class="md-tab-pane" data-tab="prompts">
                        <div class="md-tab-toolbar">
                            <button class="btn btn-outline btn-sm" id="btn-refresh-prompts"
                                type="button">↻ 刷新提示词</button>
                        </div>
                        <div id="prompt-list" class="md-item-list"></div>
                    </div>
                    <!-- 原始请求 -->
                    <div class="md-tab-pane" data-tab="raw">
                        <div class="md-raw-form">
                            <div class="ui-form-row">
                                <label class="ui-form-label" style="width:72px;flex:0 0 72px;">method *</label>
                                <input type="text" class="ui-form-input" id="f-raw-method"
                                    placeholder="如 tools/list、resources/read" style="flex:1;">
                            </div>
                            <div class="ui-form-row" style="flex-direction:column;align-items:stretch;">
                                <label class="ui-form-label" style="width:auto;flex:none;margin-bottom:0.25rem;">params
                                    (JSON)</label>
                                <textarea class="ui-form-input md-jsonarea" id="f-raw-params"
                                    placeholder="{} 或留空"></textarea>
                            </div>
                            <label class="ui-toggle">
                                <input type="checkbox" id="f-raw-notification">
                                <span>作为通知发送（无 id；method 以 notifications/ 开头时自动生效）</span>
                            </label>
                            <button class="btn btn-primary btn-sm" id="btn-raw-send" type="button"
                                style="align-self:flex-start;">▶ 发送</button>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- ============ 右侧：操作表单 + 结果 ============ -->
            <section class="md-right">
                <!-- 操作表单（独立块，选中工具/资源/提示词时显示） -->
                <div class="md-panel md-action" id="action-panel" hidden>
                    <div class="md-panel-title">
                        <span>提交参数</span>
                        <button class="md-mini-btn" id="btn-close-form" title="关闭表单">✕</button>
                    </div>
                    <div id="action-form" class="md-action-form"></div>
                </div>

                <!-- 执行结果（独立块） -->
                <div class="md-panel md-result">
                    <div class="md-panel-title">
                        <span>执行结果</span>
                        <div class="md-title-right">
                            <div id="summary-head" class="md-summary" hidden>
                                <span id="sum-ok" class="ui-badge ok">成功</span>
                                <span id="sum-elapsed" class="md-meta">–</span>
                            </div>
                            <button class="btn btn-ghost btn-sm" id="btn-clear" type="button" hidden>清空结果</button>
                        </div>
                    </div>

                    <!-- 概览 -->
                    <div id="overview" class="md-overview" hidden>
                        <div class="md-ov-row">
                            <div class="md-ov-label">动作</div>
                            <div class="md-ov-val" id="ov-action">–</div>
                            <div class="md-ov-label">目标</div>
                            <div class="md-ov-val md-ov-truncate" id="ov-endpoint">–</div>
                        </div>
                        <div class="md-ov-row">
                            <div class="md-ov-label">步骤</div>
                            <div class="md-ov-val" id="ov-steps">–</div>
                            <div class="md-ov-label">传输</div>
                            <div class="md-ov-val" id="ov-transport">–</div>
                        </div>
                    </div>

                    <!-- 通知 -->
                    <div id="notifications" class="md-notifications" hidden></div>

                    <!-- 步骤列表 -->
                    <div id="steps" class="md-steps"></div>

                    <!-- 空状态 -->
                    <div id="empty-state" class="admin-empty">
                        <div class="icon">🔭</div>
                        <h3>尚未执行调试</h3>
                        <p>填写左侧端点，点击「连接并加载」自动完成握手并拉取工具/资源/提示词列表；<br>随后直接点击工具即可在上方填写参数并调用，全程无需手写 JSON。</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="../../app.js"></script>
    <script src="../../api.js"></script>
    <script src="./../common.js"></script>
    <script src="./mcp_debug.js"></script>
</body>

</html>
