<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./music_player.css">
</head>

<body>
    <div class="tool-page" data-no-header>
        <div class="music-shell">
            <!-- 顶部工具栏 -->
            <div class="music-head">
                <h1><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="vertical-align:-3px;margin-right:4px"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>音乐播放器</h1>
                <select class="ui-form-input" id="music-source-select" style="width:160px;flex:0 0 auto">
                    <option value="">全部目录</option>
                </select>
                <div class="music-search-wrap">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" class="music-search-icon">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" class="music-search" id="music-search" placeholder="搜索歌曲…">
                </div>
                <button class="music-icon-btn" id="music-manage" title="目录管理">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                </button>
                <button class="music-icon-btn" id="music-refresh" title="重新扫描">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <polyline points="1 20 1 14 7 14"></polyline>
                        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                    </svg>
                </button>
                <div class="music-sort-wrap" id="music-sort-wrap">
                    <button class="music-icon-btn" id="music-sort-btn" title="排序方式">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18M3 12h12M3 18h6"></path>
                        </svg>
                    </button>
                    <div class="music-sort-menu" id="music-sort-menu">
                        <div class="music-sort-section">
                            <div class="music-sort-label">排序字段</div>
                            <div class="music-sort-item" data-sort-by="">默认</div>
                            <div class="music-sort-item" data-sort-by="name">名称</div>
                            <div class="music-sort-item" data-sort-by="size">大小</div>
                            <div class="music-sort-item" data-sort-by="modified">修改时间</div>
                        </div>
                        <div class="music-sort-section">
                            <div class="music-sort-label">排序方式</div>
                            <div class="music-sort-item" data-sort-order="asc">升序 ↑</div>
                            <div class="music-sort-item" data-sort-order="desc">降序 ↓</div>
                        </div>
                    </div>
                </div>
                <div class="music-spacer"></div>
                <span class="music-count" id="music-count">0 首</span>
            </div>

            <!-- 列表区 -->
            <div class="music-main">
                <div class="music-list-header">
                    <span class="col-title">曲目</span>
                    <span class="col-source">来源</span>
                    <span class="col-size">大小</span>
                </div>
                <div class="music-list-wrap" id="music-list">
                    <div class="music-empty">
                        <div class="icon"><svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
                        <p>请添加音乐目录开始扫描</p>
                    </div>
                </div>
            </div>

            <!-- 底部播放栏 -->
            <div class="music-player-bar">
                <div class="music-cover" id="music-cover"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
                <div class="music-track-info" id="music-track-info">
                    <div class="now-title" id="now-title">未播放</div>
                    <div class="now-source" id="now-source">—</div>
                </div>
                <div class="music-controls">
                    <button class="music-ctrl-btn" id="btn-prev" title="上一首">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                        </svg>
                    </button>
                    <button class="music-ctrl-btn play" id="btn-play" title="播放/暂停">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="icon-play">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </button>
                    <button class="music-ctrl-btn" id="btn-next" title="下一首">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"></path>
                        </svg>
                    </button>
                </div>
                <div class="music-progress-col">
                    <div class="music-bar-lyrics" id="music-bar-lyrics">—</div>
                    <div class="music-progress-wrap">
                        <span class="music-time" id="time-cur">0:00</span>
                        <input type="range" class="music-progress" id="music-progress" min="0" max="1000" value="0">
                        <span class="music-time" id="time-total">0:00</span>
                    </div>
                </div>
                <div class="music-extra">
                    <button class="music-ctrl-btn" id="btn-mode" title="播放模式" style="width:30px;height:30px">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-mode">
                            <polyline points="17 1 21 5 17 9"></polyline>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                            <polyline points="7 23 3 19 7 15"></polyline>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                        </svg>
                    </button>
                    <svg id="vol-icon-bar" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-light);cursor:pointer" title="静音/取消静音">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path class="vol-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <g class="vol-x" style="display:none">
                            <line x1="16" y1="9" x2="22" y2="15"></line>
                            <line x1="22" y1="9" x2="16" y2="15"></line>
                        </g>
                    </svg>
                    <input type="range" class="music-volume" id="music-volume" min="0" max="100" value="80">
                </div>
            </div>
        </div>

        <!-- 全屏播放页 -->
        <div class="music-fullpage" id="music-fullpage" style="display:none">
            <div class="mf-bg" id="mf-bg"></div>
            <div class="mf-content">
                <button class="mf-close" id="mf-close" title="关闭">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="mf-left">
                    <div class="mf-disc" id="mf-disc">
                        <div class="mf-disc-inner">
                            <div class="mf-cover" id="mf-cover"><svg viewBox="0 0 24 24" width="48" height="48" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div>
                        </div>
                    </div>
                    <div class="mf-title" id="mf-title">未播放</div>
                    <div class="mf-source" id="mf-source">—</div>
                    <canvas class="mf-spectrum" id="mf-spectrum" width="320" height="80"></canvas>
                </div>
                <div class="mf-right">
                    <div class="mf-lyrics" id="mf-lyrics">
                        <div class="mf-lyrics-empty">暂无歌词</div>
                    </div>
                </div>
            </div>
            <div class="mf-progress-area">
                <div class="music-progress-wrap mf-progress-wrap">
                    <span class="music-time" id="mf-time-cur">0:00</span>
                    <input type="range" class="music-progress" id="mf-progress" min="0" max="1000" value="0">
                    <span class="music-time" id="mf-time-total">0:00</span>
                </div>
                <div class="mf-controls">
                    <button class="music-ctrl-btn" id="mf-prev" title="上一首">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"></path>
                        </svg>
                    </button>
                    <button class="music-ctrl-btn play" id="mf-play" title="播放/暂停">
                        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" id="mf-icon-play">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </button>
                    <button class="music-ctrl-btn" id="mf-next" title="下一首">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                            <path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"></path>
                        </svg>
                    </button>
                    <div class="mf-volume-wrap">
                        <svg id="vol-icon-mf" class="mf-volume-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="rgba(255,255,255,0.85)"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="静音/取消静音">
                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                            <path class="vol-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            <g class="vol-x" style="display:none">
                                <line x1="16" y1="9" x2="22" y2="15"></line>
                                <line x1="22" y1="9" x2="16" y2="15"></line>
                            </g>
                        </svg>
                        <input type="range" class="mf-volume" id="mf-volume" min="0" max="100" value="80">
                    </div>
                </div>
            </div>
        </div>

        <!-- 添加目录弹窗 -->
        <div class="br-modal" id="music-source-modal" style="display:none">
            <div class="br-modal-mask"></div>
            <div class="br-modal-panel">
                <div class="br-modal-header">
                    <span>添加音乐目录</span>
                    <button class="br-modal-close" data-close>×</button>
                </div>
                <div class="br-modal-body">
                    <div class="br-form-row">
                        <label>名称 *</label>
                        <input type="text" class="ui-form-input" id="music-source-name" placeholder="例如：我的音乐">
                    </div>
                    <div class="br-form-row">
                        <label>本机目录 *</label>
                        <div class="ui-form-input-group">
                            <input type="text" class="ui-form-input" id="music-source-path" placeholder="例如 D:\Music">
                            <button class="btn btn-outline btn-sm" id="music-source-browse">浏览…</button>
                        </div>
                    </div>
                </div>
                <div class="br-modal-footer">
                    <button class="btn" data-close>取消</button>
                    <button class="btn btn-primary" id="music-source-save">保存</button>
                </div>
            </div>
        </div>

        <!-- 目录管理弹窗（大） -->
        <div class="br-modal" id="music-manage-modal" style="display:none">
            <div class="br-modal-mask"></div>
            <div class="br-modal-panel mm-panel">
                <div class="br-modal-header">
                    <span>音乐目录管理</span>
                    <button class="br-modal-close" data-mm-close>×</button>
                </div>
                <div class="br-modal-body mm-body">
                    <div class="mm-toolbar">
                        <button class="btn btn-primary btn-sm" id="mm-add">
                            <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"
                                stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            添加目录
                        </button>
                        <span class="mm-tip">可将歌曲加入黑名单以隐藏</span>
                    </div>
                    <div class="mm-list" id="mm-list">
                        <div class="music-loading">加载中…</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../app.js"></script>
    <script src="../../api.js"></script>
    <script src="./../common.js"></script>
    <script src="../../fs_browser.js"></script>
    <script src="./music_player.js"></script>
</body>

</html>
