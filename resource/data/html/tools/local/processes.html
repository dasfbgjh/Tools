<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务进程管理</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../theme.js"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="./processes.css">
</head>

<body>
    <div class="tool-page">
        <div class="tool-card" style="margin-bottom:1.5rem;">
            <div class="tool-toolbar" style="margin:0;">
                <h2 style="margin:0;flex:0 0 auto;">服务进程管理</h2>
                <span class="spacer"></span>
                <button class="btn btn-primary" id="btn-new">+ 新建进程</button>
            </div>
        </div>
        <div id="banner"></div>
        <div class="proc-list" id="proc-list"></div>
    </div>

    <!-- 编辑/新建弹窗 -->
    <div class="ui-fs-modal" id="p-modal" hidden>
        <div class="ui-fs-modal-head" style="margin-bottom:0.5rem;">
            <strong id="p-modal-title">新建进程</strong>
        </div>
        <div class="ui-modal-form">
            <div class="ui-form-row">
                <label class="ui-form-label">名称</label>
                <input type="text" class="ui-form-input" id="f-name" placeholder="例如: 静态服务器" style="flex:1;">
            </div>
            <div class="ui-form-row">
                <label class="ui-form-label">命令</label>
                <input type="text" class="ui-form-input" id="f-command" placeholder="例如: python 或 C:\path\to\app.exe"
                    style="flex:1;font-family:ui-monospace,monospace;">
            </div>
            <div class="ui-form-row">
                <label class="ui-form-label">参数</label>
                <input type="text" class="ui-form-input" id="f-args" placeholder="空格分隔的参数: -m http.server 8080"
                    style="flex:1;">
            </div>
            <div class="ui-form-row">
                <label class="ui-form-label">工作目录</label>
                <input type="text" class="ui-form-input" id="f-cwd" placeholder="留空使用进程默认" style="flex:1;">
            </div>
            <div class="ui-form-row">
                <label class="ui-form-label">备注</label>
                <textarea class="ui-form-input" id="f-remarks" rows="3" placeholder="可选：描述此进程的用途，URL 链接会被自动识别"
                    style="flex:1;min-height:4.5rem;resize:vertical;font-family:inherit;"></textarea>
            </div>
            <div class="ui-form-row">
                <label class="ui-toggle">
                    <input type="checkbox" id="f-inherit" checked>
                    <span>继承系统环境变量</span>
                </label>
                <span class="ui-spacer"></span>
                <label class="ui-toggle">
                    <input type="checkbox" id="f-auto">
                    <span>应用启动时自动启动</span>
                </label>
            </div>
            <div class="ui-fieldset">
                <div class="ui-fieldset-title">环境变量（PATH 行为：继承时追加到系统 PATH；不继承时替换）</div>
                <div id="f-env"></div>
                <button class="btn btn-sm" id="f-env-add">+ 添加环境变量</button>
            </div>
        </div>
        <div class="ui-fs-modal-foot">
            <span id="p-modal-err" class="ui-banner-error" style="display:none;"></span>
            <span class="ui-spacer"></span>
            <button class="btn btn-outline" data-modal-close>取消</button>
            <button class="btn btn-primary" id="f-save">保存</button>
        </div>
    </div>

    <!-- 日志查看器 -->
    <div class="ui-fs-modal" id="log-modal" hidden>
        <div class="ui-fs-modal-head" style="margin-bottom:0.5rem;">
            <strong id="log-title">日志</strong>
            <span class="ui-spacer" style="flex:1;"></span>
            <label class="ui-toggle">
                <input type="checkbox" id="log-auto" checked>
                <span>自动滚动</span>
            </label>
            <button class="btn btn-sm btn-outline" id="log-clear">清空</button>
            <button class="btn btn-ghost" data-modal-close title="关闭" aria-label="关闭"
                style="display:inline-flex; align-items:center; justify-content:center; padding: 0.25rem 0.4375rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                    <line x1="6" y1="18" x2="18" y2="6"></line>
                </svg>
            </button>
        </div>
        <div class="proc-log" id="log-body"></div>
        <div class="ui-fs-modal-foot">
            <span id="log-stats">0 行</span>
            <span class="ui-spacer"></span>
            <span id="log-status" class="ui-badge pending">未运行</span>
        </div>
    </div>

    <script src="../../app.js"></script>
    <script src="../../api.js"></script>
    <script src="./../common.js"></script>
    <script src="./processes.js"></script>
</body>

</html>
