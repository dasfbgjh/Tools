<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL编码解码</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .opt-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="tool-page">


        <div class="tool-card">
            <div id="banner"></div>

            <div class="tool-toolbar">
                <button class="btn btn-sm" id="btn-encode">编码</button>
                <button class="btn btn-sm" id="btn-decode">解码</button>
                <button class="btn btn-ghost btn-sm" id="btn-copy">复制结果</button>
                <button class="btn btn-ghost btn-sm" id="btn-swap">交换</button>
                <span class="spacer"></span>
                <button class="btn btn-outline btn-sm" id="btn-clear">清空</button>
            </div>

            <div class="opt-row">
                <label class="tool-check-row">
                    <input type="checkbox" id="opt-all"> 编码所有字符
                </label>
                <label class="tool-check-row">
                    <input type="checkbox" id="opt-slash"> 保留斜杠
                </label>
                <label class="tool-check-row">
                    <input type="checkbox" id="opt-plus"> 使用+号代替%20
                </label>
            </div>
            <div class="tool-hint" id="opt-hint"></div>

            <div class="tool-grid-2">
                <div>
                    <label class="tool-label" id="input-label">输入原始文本</label>
                    <textarea class="tool-textarea" id="input-text" placeholder="在此输入要编码的文本..."></textarea>
                </div>
                <div>
                    <label class="tool-label" id="output-label">编码结果</label>
                    <textarea class="tool-textarea" id="output-text" readonly placeholder="编码结果将显示在这里..."></textarea>
                </div>
            </div>
        </div>
    </div>

    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script>
        'use strict';
        document.addEventListener('DOMContentLoaded', function () {
            var lastAction = 'encode';
            var timer = null;

            function opts() {
                return {
                    all: Tools.$('opt-all').checked,
                    slash: Tools.$('opt-slash').checked,
                    plus: Tools.$('opt-plus').checked
                };
            }

            function encodeText(text, o) {
                var result;
                if (o.all) {
                    // encode every character as %XX (UTF-8 bytes)
                    var bytes = new TextEncoder().encode(text);
                    result = '';
                    for (var i = 0; i < bytes.length; i++) {
                        result += '%' + ('00' + bytes[i].toString(16).toUpperCase()).slice(-2);
                    }
                } else if (o.slash) {
                    // keep URL structural chars (encodeURI does this), then make sure slashes are intact
                    result = encodeURI(text);
                } else {
                    result = encodeURIComponent(text);
                }
                if (o.plus) {
                    result = result.replace(/%20/g, '+');
                }
                return result;
            }

            function decodeText(text, o) {
                var s = text;
                if (o.plus) {
                    // form-urlencoded: + means space
                    s = s.replace(/\+/g, '%20');
                }
                // decodeURIComponent handles all %XX sequences regardless of encode mode
                return decodeURIComponent(s);
            }

            function updateHint() {
                var o = opts();
                var parts = [];
                if (o.all) parts.push('编码所有字符（每个字节转为 %XX）');
                else if (o.slash) parts.push('保留 URL 结构字符（/ ? : @ & = + $ #）');
                else parts.push('使用 encodeURIComponent（编码所有特殊字符）');
                if (o.plus) parts.push('空格编码为 +');
                Tools.$('opt-hint').textContent = '当前模式：' + parts.join('，');
            }

            function updateLabels(action) {
                if (action === 'encode') {
                    Tools.$('input-label').textContent = '输入原始文本';
                    Tools.$('output-label').textContent = '编码结果';
                    Tools.$('input-text').placeholder = '在此输入要编码的文本...';
                    Tools.$('output-text').placeholder = '编码结果将显示在这里...';
                } else {
                    Tools.$('input-label').textContent = '输入编码文本';
                    Tools.$('output-label').textContent = '解码结果';
                    Tools.$('input-text').placeholder = '在此输入要解码的URL编码...';
                    Tools.$('output-text').placeholder = '解码结果将显示在这里...';
                }
            }

            function run(action) {
                lastAction = action;
                var input = Tools.$('input-text').value;
                var out = Tools.$('output-text');
                Tools.clearBanner('banner');
                if (!input) { out.value = ''; return; }
                try {
                    out.value = action === 'encode'
                        ? encodeText(input, opts())
                        : decodeText(input, opts());
                } catch (e) {
                    out.value = '';
                    Tools.showBanner('banner', 'error', '解码失败：无效的 URL 编码字符串');
                }
            }

            function debouncedRun() {
                clearTimeout(timer);
                timer = setTimeout(function () { run(lastAction); }, 200);
            }

            // Events
            Tools.$('input-text').addEventListener('input', debouncedRun);
            ['opt-all', 'opt-slash', 'opt-plus'].forEach(function (id) {
                Tools.$(id).addEventListener('change', function () {
                    updateHint();
                    debouncedRun();
                });
            });
            Tools.$('btn-encode').addEventListener('click', function () {
                updateLabels('encode');
                run('encode');
            });
            Tools.$('btn-decode').addEventListener('click', function () {
                updateLabels('decode');
                run('decode');
            });
            Tools.$('btn-clear').addEventListener('click', function () {
                Tools.$('input-text').value = '';
                Tools.$('output-text').value = '';
                Tools.clearBanner('banner');
            });
            Tools.$('btn-copy').addEventListener('click', function () {
                var out = Tools.$('output-text').value;
                if (!out) return;
                Tools.copyText(out, this, '已复制');
            });
            Tools.$('btn-swap').addEventListener('click', function () {
                var inp = Tools.$('input-text');
                var out = Tools.$('output-text');
                if (!out.value) return;
                inp.value = out.value;
                // flip action
                var next = lastAction === 'encode' ? 'decode' : 'encode';
                updateLabels(next);
                run(next);
            });

            updateLabels('encode');
            updateHint();
        });
    </script>
</body>

</html>
