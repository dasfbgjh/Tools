<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji选择器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .emoji-search {
            position: relative;
            margin-bottom: 1rem;
        }

        .emoji-search input {
            width: 100%;
            padding: 0.6rem 0.85rem 0.6rem 2.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font-size: 0.875rem;
        }

        .emoji-search input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .emoji-search .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .emoji-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .emoji-tab {
            padding: 0.375rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8125rem;
            transition: all 0.15s;
        }

        .emoji-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .emoji-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
            gap: 0.25rem;
            max-height: 520px;
            overflow: auto;
            padding: 0.25rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-muted);
        }

        .emoji-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            font-size: 1.5rem;
            line-height: 1;
            cursor: pointer;
            border-radius: 6px;
            background: transparent;
            transition: background 0.12s, transform 0.12s;
            user-select: none;
        }

        .emoji-cell:hover {
            background: var(--primary-light);
            transform: scale(1.12);
        }

        .emoji-empty {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 2rem 1rem;
            color: var(--text-light);
            font-size: 0.875rem;
        }

        .emoji-empty-msg {
            text-align: center;
        }

        .emoji-empty-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .emoji-empty-chip {
            padding: 0.3rem 0.85rem;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface);
            color: var(--text);
            font-size: 0.8125rem;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
            font-family: inherit;
        }

        .emoji-empty-chip:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }
    </style>
</head>

<body>
    <div class="tool-page">

        <div class="tool-card">
            <div class="emoji-search">
                <span class="search-icon">🔍</span>
                <input type="text" id="search" placeholder="搜索 emoji 分类（如：动物、食物、手势、符号）..." autocomplete="off">
            </div>
            <div id="tabs" class="emoji-tabs"></div>
            <div id="banner" style="margin-bottom:0.75rem;"></div>
            <div id="grid" class="emoji-grid"></div>
            <p class="tool-hint" id="hint">点击任意 emoji 即可复制到剪贴板，最近使用会置顶记录</p>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./emoji_picker.js"></script>
</body>

</html>
