<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML与Markdown互转</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .tab-group {
            display: inline-flex;
            gap: 0.25rem;
            padding: 0.25rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .tab-btn {
            padding: 0.375rem 0.875rem;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: calc(var(--radius) - 2px);
            font-size: 0.8125rem;
            font-weight: 500;
            transition: all 0.15s;
        }

        .tab-btn:hover {
            color: var(--text);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="tool-page">

        <div id="banner-container"></div>

        <div class="tool-toolbar">
            <div class="tab-group" id="tab-group">
                <button type="button" class="tab-btn active" data-mode="md2html">Markdown → HTML</button>
                <button type="button" class="tab-btn" data-mode="html2md">HTML → Markdown</button>
            </div>
            <span class="spacer"></span>
            <button id="btn-convert" class="btn btn-sm" type="button">转换</button>
            <button id="btn-copy" class="btn btn-ghost btn-sm" type="button">复制结果</button>
            <button id="btn-swap" class="btn btn-ghost btn-sm" type="button">交换</button>
            <button id="btn-clear" class="btn btn-ghost btn-sm" type="button">清空</button>
        </div>

        <div class="tool-grid-2">
            <div class="tool-card">
                <label class="tool-label" id="input-label">Markdown 输入</label>
                <textarea id="input" class="tool-textarea lg" placeholder="请输入 Markdown 内容..."></textarea>
            </div>
            <div class="tool-card">
                <label class="tool-label" id="output-label">HTML 输出</label>
                <textarea id="output" class="tool-textarea lg" readonly placeholder="转换结果将显示在这里..."></textarea>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>功能说明</h2>
            <ul class="tool-result-list">
                <li><span class="label">支持语法</span><span class="value">标题、粗体、斜体、代码、链接、图片、列表、引用、分隔线、代码块</span></li>
                <li><span class="label">HTML → Markdown</span><span class="value">使用浏览器原生 DOMParser 解析后遍历 DOM 树转换</span>
                </li>
                <li><span class="label">Markdown → HTML</span><span class="value">基于正则的简化转换（非完整 CommonMark 实现）</span>
                </li>
                <li><span class="label">交换</span><span class="value">将输出内容填入输入并切换转换方向</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script>
        'use strict';
        document.addEventListener('DOMContentLoaded', function () {
            var $ = Tools.$;
            var inputEl = $('input');
            var outputEl = $('output');
            var inputLabel = $('input-label');
            var outputLabel = $('output-label');
            var tabGroup = $('tab-group');
            var mode = 'md2html';

            function setMode(m) {
                mode = m;
                Tools.$$('.tab-btn', tabGroup).forEach(function (b) {
                    b.classList.toggle('active', b.getAttribute('data-mode') === m);
                });
                if (m === 'md2html') {
                    inputLabel.textContent = 'Markdown 输入';
                    outputLabel.textContent = 'HTML 输出';
                    inputEl.placeholder = '请输入 Markdown 内容...';
                    outputEl.placeholder = 'HTML 转换结果将显示在这里...';
                } else {
                    inputLabel.textContent = 'HTML 输入';
                    outputLabel.textContent = 'Markdown 输出';
                    inputEl.placeholder = '请输入 HTML 内容...';
                    outputEl.placeholder = 'Markdown 转换结果将显示在这里...';
                }
            }

            tabGroup.addEventListener('click', function (e) {
                var btn = e.target.closest('.tab-btn');
                if (!btn) return;
                setMode(btn.getAttribute('data-mode'));
            });

            // ===== Markdown → HTML =====
            function escapeHtml(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function mdToHtml(src) {
                var lines = src.replace(/\r\n/g, '\n').split('\n');
                var html = [];
                var i = 0;
                var inCodeBlock = false;
                var codeLang = '';
                var codeBuf = [];
                var listType = null; // 'ul' | 'ol'
                var listItems = [];
                var paraBuf = [];

                function flushPara() {
                    if (paraBuf.length) {
                        var text = paraBuf.join(' ').trim();
                        if (text) html.push('<p>' + inline(text) + '</p>');
                        paraBuf = [];
                    }
                }
                function flushList() {
                    if (listType) {
                        var tag = listType === 'ul' ? 'ul' : 'ol';
                        var items = listItems.map(function (it) { return '<li>' + inline(it) + '</li>'; }).join('');
                        html.push('<' + tag + '>' + items + '</' + tag + '>');
                        listType = null;
                        listItems = [];
                    }
                }
                function inline(s) {
                    // escape HTML first
                    s = escapeHtml(s);
                    // inline code (do first to protect content)
                    var codeStash = [];
                    s = s.replace(/`([^`]+)`/g, function (_, code) {
                        codeStash.push(code);
                        return '\u0000CODE' + (codeStash.length - 1) + '\u0000';
                    });
                    // images ![alt](url)
                    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img src="$2" alt="$1">');
                    // links [text](url)
                    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2">$1</a>');
                    // bold **text**
                    s = s.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
                    s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
                    // italic *text*
                    s = s.replace(/\*([^\*]+)\*/g, '<em>$1</em>');
                    s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
                    // restore inline code
                    s = s.replace(/\u0000CODE(\d+)\u0000/g, function (_, idx) {
                        return '<code>' + escapeHtml(codeStash[parseInt(idx, 10)]) + '</code>';
                    });
                    return s;
                }

                while (i < lines.length) {
                    var line = lines[i];
                    // code block fence
                    var fence = /^```(.*)$/.exec(line);
                    if (fence) {
                        if (!inCodeBlock) {
                            flushPara();
                            flushList();
                            inCodeBlock = true;
                            codeLang = fence[1].trim();
                            codeBuf = [];
                        } else {
                            var code = codeBuf.join('\n');
                            var cls = codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : '';
                            html.push('<pre><code' + cls + '>' + escapeHtml(code) + '</code></pre>');
                            inCodeBlock = false;
                            codeLang = '';
                            codeBuf = [];
                        }
                        i++;
                        continue;
                    }
                    if (inCodeBlock) {
                        codeBuf.push(line);
                        i++;
                        continue;
                    }
                    // blank line
                    if (!line.trim()) {
                        flushPara();
                        flushList();
                        i++;
                        continue;
                    }
                    // hr
                    if (/^\s*([-*_])\1\1[-*_\s]*$/.test(line)) {
                        flushPara();
                        flushList();
                        html.push('<hr>');
                        i++;
                        continue;
                    }
                    // heading
                    var h = /^(#{1,6})\s+(.*)$/.exec(line);
                    if (h) {
                        flushPara();
                        flushList();
                        var level = h[1].length;
                        html.push('<h' + level + '>' + inline(h[2].trim()) + '</h' + level + '>');
                        i++;
                        continue;
                    }
                    // blockquote
                    if (/^\s*>/.test(line)) {
                        flushPara();
                        flushList();
                        var quoteLines = [];
                        while (i < lines.length && /^\s*>/.test(lines[i])) {
                            quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
                            i++;
                        }
                        html.push('<blockquote><p>' + inline(quoteLines.join(' ')) + '</p></blockquote>');
                        continue;
                    }
                    // unordered list
                    var ul = /^\s*[-*+]\s+(.*)$/.exec(line);
                    if (ul) {
                        flushPara();
                        if (listType && listType !== 'ul') flushList();
                        listType = 'ul';
                        listItems.push(ul[1].trim());
                        i++;
                        continue;
                    }
                    // ordered list
                    var ol = /^\s*\d+\.\s+(.*)$/.exec(line);
                    if (ol) {
                        flushPara();
                        if (listType && listType !== 'ol') flushList();
                        listType = 'ol';
                        listItems.push(ol[1].trim());
                        i++;
                        continue;
                    }
                    // normal paragraph line
                    paraBuf.push(line.trim());
                    i++;
                }
                if (inCodeBlock) {
                    // unterminated code block
                    html.push('<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>');
                }
                flushPara();
                flushList();
                return html.join('\n');
            }

            // ===== HTML → Markdown =====
            function htmlToMd(src) {
                var doc = new DOMParser().parseFromString(src, 'text/html');
                var out = [];

                function walk(node, indent) {
                    var children = node.childNodes;
                    for (var i = 0; i < children.length; i++) {
                        var child = children[i];
                        if (child.nodeType === 3) { // text
                            var text = child.nodeValue.replace(/\s+/g, ' ');
                            if (text.trim()) out.push(text);
                        } else if (child.nodeType === 1) {
                            var tag = child.tagName.toLowerCase();
                            switch (tag) {
                                case 'h1': case 'h2': case 'h3':
                                case 'h4': case 'h5': case 'h6':
                                    out.push('\n\n' + '#'.repeat(parseInt(tag[1], 10)) + ' ' + textOf(child) + '\n\n');
                                    break;
                                case 'p':
                                    out.push('\n\n' + textOf(child) + '\n\n');
                                    break;
                                case 'br':
                                    out.push('  \n');
                                    break;
                                case 'hr':
                                    out.push('\n\n---\n\n');
                                    break;
                                case 'strong': case 'b':
                                    out.push('**' + textOf(child) + '**');
                                    break;
                                case 'em': case 'i':
                                    out.push('*' + textOf(child) + '*');
                                    break;
                                case 'code':
                                    // if inside pre, handled by pre; else inline
                                    out.push('`' + textOf(child) + '`');
                                    break;
                                case 'pre':
                                    var codeText = child.textContent.replace(/\s+$/, '');
                                    out.push('\n\n```\n' + codeText + '\n```\n\n');
                                    break;
                                case 'a': {
                                    var href = child.getAttribute('href') || '';
                                    out.push('[' + textOf(child) + '](' + href + ')');
                                    break;
                                }
                                case 'img': {
                                    var alt = child.getAttribute('alt') || '';
                                    var s = child.getAttribute('src') || '';
                                    out.push('![' + alt + '](' + s + ')');
                                    break;
                                }
                                case 'blockquote':
                                    out.push('\n\n' + textOf(child).split('\n').map(function (l) { return '> ' + l; }).join('\n') + '\n\n');
                                    break;
                                case 'ul': case 'ol': {
                                    var items = child.children;
                                    out.push('\n');
                                    for (var k = 0; k < items.length; k++) {
                                        if (items[k].tagName.toLowerCase() !== 'li') continue;
                                        var prefix = tag === 'ul' ? '- ' : (k + 1) + '. ';
                                        out.push(prefix + textOf(items[k]).replace(/\n/g, '\n  ') + '\n');
                                    }
                                    out.push('\n');
                                    break;
                                }
                                case 'div': case 'section': case 'article':
                                case 'header': case 'footer': case 'main':
                                    walk(child, indent);
                                    break;
                                default:
                                    out.push(textOf(child));
                            }
                        }
                    }
                }

                function textOf(node) {
                    var buf = [];
                    node.childNodes.forEach(function (c) {
                        if (c.nodeType === 3) {
                            buf.push(c.nodeValue.replace(/\s+/g, ' '));
                        } else if (c.nodeType === 1) {
                            var t = c.tagName.toLowerCase();
                            if (t === 'br') buf.push('  \n');
                            else if (t === 'strong' || t === 'b') buf.push('**' + textOf(c) + '**');
                            else if (t === 'em' || t === 'i') buf.push('*' + textOf(c) + '*');
                            else if (t === 'code') buf.push('`' + textOf(c) + '`');
                            else if (t === 'a') {
                                var href = c.getAttribute('href') || '';
                                buf.push('[' + textOf(c) + '](' + href + ')');
                            } else if (t === 'img') {
                                var alt = c.getAttribute('alt') || '';
                                var s = c.getAttribute('src') || '';
                                buf.push('![' + alt + '](' + s + ')');
                            } else {
                                buf.push(textOf(c));
                            }
                        }
                    });
                    return buf.join('').replace(/\s+/g, ' ').trim();
                }

                walk(doc.body, '');
                var result = out.join('');
                // Clean up excessive blank lines
                result = result.replace(/\n{3,}/g, '\n\n').replace(/^\s+/, '').replace(/\s+$/, '\n');
                return result;
            }

            function convert() {
                var raw = inputEl.value;
                Tools.clearBanner('banner-container');
                if (!raw || !raw.trim()) {
                    Tools.showBanner('banner-container', 'warn', '请输入需要转换的内容');
                    outputEl.value = '';
                    return;
                }
                try {
                    var result = mode === 'md2html' ? mdToHtml(raw) : htmlToMd(raw);
                    outputEl.value = result;
                    Tools.showBanner('banner-container', 'success', '✓ 转换成功');
                } catch (err) {
                    outputEl.value = '';
                    Tools.showBanner('banner-container', 'error', '✗ 转换失败：' + (err && err.message ? err.message : String(err)));
                }
            }

            function clearAll() {
                inputEl.value = '';
                outputEl.value = '';
                Tools.clearBanner('banner-container');
                inputEl.focus();
            }

            function swap() {
                if (!outputEl.value) return;
                inputEl.value = outputEl.value;
                outputEl.value = '';
                Tools.clearBanner('banner-container');
                setMode(mode === 'md2html' ? 'html2md' : 'md2html');
            }

            $('btn-convert').addEventListener('click', convert);
            $('btn-copy').addEventListener('click', function () {
                if (!outputEl.value) {
                    Tools.showBanner('banner-container', 'warn', '没有可复制的结果');
                    return;
                }
                Tools.copyText(outputEl.value, this, '已复制');
            });
            $('btn-swap').addEventListener('click', swap);
            $('btn-clear').addEventListener('click', clearAll);

            setMode('md2html');
        });
    </script>
</body>

</html>
