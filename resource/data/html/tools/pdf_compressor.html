<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF压缩</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: var(--bg-muted);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--bg-muted);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--bg-muted);
        }

        .upload-icon {
            font-size: 40px;
            opacity: 0.4;
            margin-bottom: 0.75rem;
        }

        .upload-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .upload-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-top: 1rem;
        }

        .file-icon {
            font-size: 32px;
        }

        .file-meta {
            flex: 1;
            min-width: 0;
        }

        .file-name {
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .file-remove {
            color: var(--danger);
            cursor: pointer;
            font-size: 0.75rem;
        }

        .progress-bar {
            height: 6px;
            background: var(--surface-2);
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 9999px;
            transition: width 0.3s;
            width: 0%;
        }
    </style>
</head>

<body>
    <div class="tool-page">

        <div id="msg-banner"></div>

        <div class="tool-grid-2">
            <div>
                <div class="tool-card">
                    <h2>上传PDF</h2>
                    <div id="upload-area" class="upload-area">
                        <div class="upload-icon">🗜️</div>
                        <div class="upload-title">拖拽PDF文件到此处或点击上传</div>
                        <div class="upload-subtitle">支持单个PDF文件,最大100MB</div>
                    </div>
                    <input type="file" id="file-input" accept=".pdf" style="display:none;">

                    <div id="file-info" class="file-info hidden">
                        <div class="file-icon">📄</div>
                        <div class="file-meta">
                            <div class="file-name" id="file-name">-</div>
                            <div class="file-size" id="file-size">-</div>
                        </div>
                        <span class="file-remove" id="file-remove">移除</span>
                    </div>

                    <div id="progress-wrap" class="hidden">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div style="text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;"
                            id="progress-text">处理中...</div>
                    </div>

                    <button id="btn-compress" class="btn btn-primary" style="width:100%;margin-top:1rem;"
                        disabled>压缩PDF</button>
                </div>
            </div>

            <div>
                <div class="tool-card">
                    <h2>压缩结果</h2>
                    <div id="result-empty" style="text-align:center;padding:3rem 1rem;color:var(--text-light);">
                        <div style="font-size:48px;opacity:0.3;margin-bottom:0.5rem;">📦</div>
                        <p style="font-size:0.8125rem;">上传PDF文件后点击压缩按钮</p>
                    </div>
                    <div id="result-info" class="hidden">
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;">
                            <div
                                style="text-align:center;padding:1rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);">
                                <div style="font-size:0.75rem;color:var(--text-muted);">原始大小</div>
                                <div style="font-size:1.25rem;font-weight:700;color:var(--text);margin-top:0.25rem;"
                                    id="orig-size">-</div>
                            </div>
                            <div
                                style="text-align:center;padding:1rem;background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);">
                                <div style="font-size:0.75rem;color:var(--text-muted);">压缩后</div>
                                <div style="font-size:1.25rem;font-weight:700;color:var(--primary);margin-top:0.25rem;"
                                    id="comp-size">-</div>
                            </div>
                        </div>
                        <div
                            style="text-align:center;padding:0.75rem;background:rgba(16,185,129,0.1);border-radius:var(--radius);margin-bottom:1rem;">
                            <div style="font-size:0.75rem;color:var(--text-muted);">压缩率</div>
                            <div style="font-size:1.5rem;font-weight:700;color:#10b981;margin-top:0.25rem;"
                                id="comp-rate">-</div>
                        </div>
                        <button id="btn-download" class="btn btn-primary" style="width:100%;">下载压缩后的PDF</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script>
        'use strict';
        document.addEventListener('DOMContentLoaded', function () {
            var uploadArea = Tools.$('upload-area');
            var fileInput = Tools.$('file-input');
            var fileInfo = Tools.$('file-info');
            var fileNameEl = Tools.$('file-name');
            var fileSizeEl = Tools.$('file-size');
            var fileRemove = Tools.$('file-remove');
            var btnCompress = Tools.$('btn-compress');
            var btnDownload = Tools.$('btn-download');
            var progressWrap = Tools.$('progress-wrap');
            var progressFill = Tools.$('progress-fill');
            var progressText = Tools.$('progress-text');
            var resultEmpty = Tools.$('result-empty');
            var resultInfo = Tools.$('result-info');
            var origSizeEl = Tools.$('orig-size');
            var compSizeEl = Tools.$('comp-size');
            var compRateEl = Tools.$('comp-rate');

            var currentFile = null;
            var resultBlob = null;

            function formatSize(bytes) {
                if (bytes < 1024) return bytes + ' B';
                if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }

            function setFile(file) {
                currentFile = file;
                fileNameEl.textContent = file.name;
                fileSizeEl.textContent = formatSize(file.size);
                fileInfo.classList.remove('hidden');
                btnCompress.disabled = false;
                resultInfo.classList.add('hidden');
                resultEmpty.classList.remove('hidden');
            }

            function clearFile() {
                currentFile = null;
                resultBlob = null;
                fileInfo.classList.add('hidden');
                btnCompress.disabled = true;
                resultInfo.classList.add('hidden');
                resultEmpty.classList.remove('hidden');
                fileInput.value = '';
            }

            uploadArea.addEventListener('click', function () { fileInput.click(); });
            fileInput.addEventListener('change', function (e) {
                if (e.target.files && e.target.files[0]) setFile(e.target.files[0]);
            });

            uploadArea.addEventListener('dragover', function (e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', function (e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', function (e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                var files = e.dataTransfer && e.dataTransfer.files;
                if (files && files[0]) {
                    if (files[0].type === 'application/pdf' || files[0].name.toLowerCase().endsWith('.pdf')) {
                        setFile(files[0]);
                    } else {
                        Tools.showBanner('msg-banner', 'error', '请上传PDF文件');
                    }
                }
            });

            fileRemove.addEventListener('click', clearFile);

            btnCompress.addEventListener('click', function () {
                if (!currentFile) return;
                if (currentFile.size > 100 * 1024 * 1024) {
                    Tools.showBanner('msg-banner', 'error', '文件超过100MB限制');
                    return;
                }

                btnCompress.disabled = true;
                progressWrap.classList.remove('hidden');
                progressFill.style.width = '30%';
                progressText.textContent = '正在压缩...';

                var form = new FormData();
                form.append('file', currentFile);

                Api.pdf.compress(form, {
                    onProgress: function (e) {
                        var pct = Math.round((e.loaded / e.total) * 50);
                        progressFill.style.width = pct + '%';
                    },
                    onLoad: function (xhr, blob) {
                        progressFill.style.width = '100%';
                        resultBlob = blob;
                        var origSize = currentFile.size;
                        var newSize = resultBlob.size;
                        var rate = ((1 - newSize / origSize) * 100).toFixed(1);

                        origSizeEl.textContent = formatSize(origSize);
                        compSizeEl.textContent = formatSize(newSize);
                        compRateEl.textContent = rate + '%';

                        resultEmpty.classList.add('hidden');
                        resultInfo.classList.remove('hidden');
                        progressText.textContent = '压缩完成';
                        Tools.showBanner('msg-banner', 'success', '压缩成功!');
                        btnCompress.disabled = false;
                        setTimeout(function () { progressWrap.classList.add('hidden'); }, 1500);
                    },
                    onError: function (xhr, err) {
                        progressText.textContent = '压缩失败';
                        Tools.showBanner('msg-banner', 'error', (err && err.error) || '压缩失败');
                        btnCompress.disabled = false;
                        setTimeout(function () { progressWrap.classList.add('hidden'); }, 1500);
                    }
                });
            });

            btnDownload.addEventListener('click', function () {
                if (!resultBlob) return;
                Tools.download('compressed.pdf', resultBlob, 'application/pdf');
            });
        });
    </script>
</body>

</html>
