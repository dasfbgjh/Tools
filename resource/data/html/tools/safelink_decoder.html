<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全链接解码器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .safelink-result-item {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-muted);
            padding: 0.875rem 1rem;
            margin-bottom: 0.75rem;
        }

        .safelink-result-item:last-child { margin-bottom: 0; }

        .safelink-result-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }

        .safelink-idx {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-light);
            min-width: 1.5rem;
        }

        .safelink-format-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 4px;
            font-size: 0.6875rem;
            font-weight: 500;
        }

        .safelink-format-tag.unknown {
            background: rgba(239, 68, 68, 0.12);
            color: #dc2626;
        }

        .safelink-original {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            word-break: break-all;
            margin-bottom: 0.5rem;
        }

        .safelink-decoded {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.875rem;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 0.625rem 0.75rem;
            word-break: break-all;
            font-weight: 600;
        }

        .safelink-decoded.empty {
            color: var(--text-light);
            font-style: italic;
            font-weight: 400;
        }

        .safelink-steps {
            margin-top: 0.5rem;
            padding-left: 1rem;
        }

        .safelink-steps li {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.125rem 0;
            word-break: break-all;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        .safelink-steps li .step-label {
            color: var(--primary);
            font-weight: 600;
            margin-right: 0.375rem;
        }

        .safelink-actions {
            display: flex;
            gap: 0.375rem;
            margin-top: 0.5rem;
        }

        .safelink-empty {
            text-align: center;
            color: var(--text-light);
            font-style: italic;
            padding: 2rem 1rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <label class="tool-label" for="input-links">输入安全链接（每行一个，支持批量）</label>
            <textarea id="input-links" class="tool-textarea" placeholder="粘贴安全链接，每行一个&#10;例如：&#10;https://www.google.com/url?q=https://example.com&sa=U&#10;https://nam01.safelinks.protection.outlook.com/?url=https%3A%2F%2Fexample.com"></textarea>

            <div class="tool-toolbar" style="margin-top:0.75rem;">
                <button id="btn-decode" class="btn btn-sm" type="button">解码</button>
                <button id="btn-copy-all" class="btn btn-outline btn-sm" type="button">复制全部结果</button>
                <button id="btn-sample" class="btn btn-ghost btn-sm" type="button">填充示例</button>
                <span class="spacer"></span>
                <button id="btn-clear" class="btn btn-ghost btn-sm" type="button">清空</button>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>解码结果</h2>
            <div id="result-list">
                <div class="safelink-empty">输入链接后点击「解码」查看结果</div>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>支持的格式</h2>
            <ul class="tool-result-list">
                <li><span class="label">Google Safe Link</span><span class="value">google.com/url?q=...</span></li>
                <li><span class="label">Outlook SafeLinks</span><span class="value">safelinks.protection.outlook.com/?url=...</span></li>
                <li><span class="label">微信安全链接</span><span class="value">weixin110.qq.com / weixin.qq.com 跳转</span></li>
                <li><span class="label">通用 URL 参数</span><span class="value">提取 url= 或 q= 参数并解码</span></li>
                <li><span class="label">Base64 编码 URL</span><span class="value">自动检测并解码 Base64 字符串</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./safelink_decoder.js"></script>
</body>

</html>
