<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码强度分析器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .pwd-input-row {
            position: relative;
        }

        .pwd-input-row .toggle-visibility {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 1rem;
            padding: 0.25rem;
        }

        .pwd-input-row .tool-input {
            padding-right: 2.5rem;
        }

        .strength-meter {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        .strength-bar {
            flex: 1;
            height: 10px;
            background: var(--border);
            border-radius: 5px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 5px;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-fill.weak {
            background: #ef4444;
        }

        .strength-fill.medium {
            background: #f59e0b;
        }

        .strength-fill.strong {
            background: #10b981;
        }

        .strength-fill.very-strong {
            background: #059669;
        }

        .strength-label {
            font-size: 0.875rem;
            font-weight: 600;
            min-width: 4rem;
            text-align: right;
        }

        .strength-label.weak {
            color: #ef4444;
        }

        .strength-label.medium {
            color: #f59e0b;
        }

        .strength-label.strong {
            color: #10b981;
        }

        .strength-label.very-strong {
            color: #059669;
        }

        .char-type-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
        }

        .char-type-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.625rem 0.875rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-muted);
        }

        .char-type-item .ct-name {
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .char-type-item .ct-val {
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .char-type-item.on {
            border-color: var(--primary);
        }

        .char-type-item.on .ct-val {
            color: var(--primary);
        }

        .char-type-item.off .ct-val {
            color: var(--text-light);
        }

        .suggestion-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .suggestion-list li {
            padding: 0.5rem 0;
            font-size: 0.8125rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
            align-items: flex-start;
        }

        .suggestion-list li:last-child {
            border-bottom: none;
        }

        .suggestion-list li .ic {
            color: #f59e0b;
            flex-shrink: 0;
        }

        .suggestion-list li.ok {
            color: #10b981;
        }

        .suggestion-list li.ok .ic {
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="tool-page">
        <div class="tool-card">
            <div id="banner"></div>

            <label class="tool-label" for="password">输入密码</label>
            <div class="pwd-input-row">
                <input type="password" id="password" class="tool-input" placeholder="输入密码进行实时分析..."
                    autocomplete="new-password" spellcheck="false">
                <button type="button" class="toggle-visibility" id="toggle-visibility" title="显示/隐藏密码">👁</button>
            </div>
            <p class="tool-hint">输入会在本地实时分析，不会上传到服务器</p>

            <div class="strength-meter">
                <div class="strength-bar">
                    <div id="strength-fill" class="strength-fill"></div>
                </div>
                <span id="strength-label" class="strength-label">—</span>
            </div>
        </div>

        <div class="tool-grid-2" style="margin-top:1.5rem;">
            <div class="tool-card">
                <h2>分析数据</h2>
                <ul class="tool-result-list">
                    <li><span class="label">密码长度</span><span class="value" id="r-length">0</span></li>
                    <li><span class="label">字符集大小</span><span class="value" id="r-charset">0</span></li>
                    <li><span class="label">熵值</span><span class="value" id="r-entropy">0 bits</span></li>
                    <li><span class="label">估算破解时间</span><span class="value" id="r-crack">—</span></li>
                    <li><span class="label">唯一字符数</span><span class="value" id="r-unique">0</span></li>
                </ul>
            </div>

            <div class="tool-card">
                <h2>字符类型</h2>
                <div class="char-type-grid">
                    <div class="char-type-item off" id="ct-lower">
                        <span class="ct-name">小写字母 a-z</span>
                        <span class="ct-val" id="ct-lower-val">0</span>
                    </div>
                    <div class="char-type-item off" id="ct-upper">
                        <span class="ct-name">大写字母 A-Z</span>
                        <span class="ct-val" id="ct-upper-val">0</span>
                    </div>
                    <div class="char-type-item off" id="ct-digit">
                        <span class="ct-name">数字 0-9</span>
                        <span class="ct-val" id="ct-digit-val">0</span>
                    </div>
                    <div class="char-type-item off" id="ct-symbol">
                        <span class="ct-name">特殊字符</span>
                        <span class="ct-val" id="ct-symbol-val">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>改进建议</h2>
            <ul id="suggestion-list" class="suggestion-list">
                <li class="ok"><span class="ic">✓</span><span>输入密码后将显示改进建议</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script src="./password_strength_analyser.js"></script>
</body>

</html>
