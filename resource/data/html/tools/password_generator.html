<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .pwd-display {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            word-break: break-all;
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--text);
        }

        .pwd-display.empty {
            color: var(--text-light);
            font-style: italic;
            font-weight: 400;
            font-size: 0.9375rem;
        }

        .strength-meter {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
        }

        .strength-bar {
            flex: 1;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            border-radius: 4px;
            transition: width 0.3s, background-color 0.3s;
        }

        .strength-fill.weak {
            background: #ef4444;
        }

        .strength-fill.medium {
            background: #f59e0b;
        }

        .strength-fill.strong {
            background: #10b981;
        }

        .strength-fill.very-strong {
            background: #059669;
        }

        .strength-label {
            font-size: 0.8125rem;
            font-weight: 600;
            min-width: 4rem;
            text-align: right;
        }

        .strength-label.weak {
            color: #ef4444;
        }

        .strength-label.medium {
            color: #f59e0b;
        }

        .strength-label.strong {
            color: #10b981;
        }

        .strength-label.very-strong {
            color: #059669;
        }

        .entropy-info {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .entropy-info b {
            color: var(--text);
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .slider-row input[type=range] {
            flex: 1;
        }

        .slider-val {
            font-weight: 600;
            color: var(--primary);
            min-width: 2.5rem;
            text-align: right;
            font-family: ui-monospace, Menlo, Consolas, monospace;
        }

        .charset-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            .charset-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.625rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: ui-monospace, Menlo, Consolas, monospace;
            font-size: 0.8125rem;
            gap: 0.5rem;
        }

        .history-item .pwd {
            word-break: break-all;
            flex: 1;
        }

        .history-item .time {
            color: var(--text-light);
            font-size: 0.6875rem;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="tool-page">

        <div id="banner-container"></div>

        <div class="tool-grid-2">
            <div class="tool-card">
                <h2>密码选项</h2>

                <label class="tool-label" for="length">密码长度</label>
                <div class="slider-row">
                    <input type="range" id="length" min="4" max="64" value="16">
                    <span class="slider-val" id="length-val">16</span>
                </div>
                <p class="tool-hint">范围 4 - 64，推荐 16+ 以保证强度</p>

                <div style="margin-top:1rem;">
                    <label class="tool-label">字符集</label>
                    <div class="charset-grid">
                        <label class="tool-check-row"><input type="checkbox" id="set-upper" checked> 大写字母 (A-Z)</label>
                        <label class="tool-check-row"><input type="checkbox" id="set-lower" checked> 小写字母 (a-z)</label>
                        <label class="tool-check-row"><input type="checkbox" id="set-digit" checked> 数字 (0-9)</label>
                        <label class="tool-check-row"><input type="checkbox" id="set-symbol" checked> 特殊符号
                            (!@#$%^&amp;*()_+-=[]{}|;:,.&lt;&gt;?)</label>
                        <label class="tool-check-row"><input type="checkbox" id="exclude-similar"> 排除易混淆字符
                            (0/O/1/l/I)</label>
                    </div>
                </div>

                <div style="margin-top:1.25rem; display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <button id="btn-generate" class="btn btn-sm" type="button">生成密码</button>
                    <button id="btn-copy" class="btn btn-outline btn-sm" type="button">复制密码</button>
                    <button id="btn-clear-history" class="btn btn-ghost btn-sm" type="button">清空历史</button>
                </div>
            </div>

            <div class="tool-card">
                <h2>生成结果</h2>
                <div id="pwd-display" class="pwd-display empty">点击「生成密码」按钮或修改选项自动生成</div>

                <div class="strength-meter">
                    <div class="strength-bar">
                        <div id="strength-fill" class="strength-fill"></div>
                    </div>
                    <span id="strength-label" class="strength-label">—</span>
                </div>
                <div class="entropy-info">
                    <span>熵值：<b id="entropy">0</b> bits</span>
                    <span>字符集大小：<b id="charset-size">0</b></span>
                </div>

                <div style="margin-top:1.5rem;">
                    <label class="tool-label">历史记录（最近 5 条）</label>
                    <div id="history-list" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
                </div>
            </div>
        </div>

        <div class="tool-card" style="margin-top:1.5rem;">
            <h2>使用说明</h2>
            <ul class="tool-result-list">
                <li><span class="label">安全随机</span><span class="value">使用 crypto.getRandomValues 生成，非 Math.random</span>
                </li>
                <li><span class="label">字符覆盖</span><span class="value">每个所选字符集至少包含一个字符，生成后 Fisher-Yates 洗牌</span></li>
                <li><span class="label">熵值</span><span class="value">bits = 长度 × log2(字符集大小)，数值越大越安全</span></li>
                <li><span class="label">强度评级</span><span class="value">弱 (&lt;40) / 中 (40-60) / 强 (60-80) / 非常强
                        (&gt;80)</span></li>
                <li><span class="label">自动生成</span><span class="value">修改长度或字符集选项时自动重新生成</span></li>
            </ul>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script>
        'use strict';
        document.addEventListener('DOMContentLoaded', function () {
            var $ = Tools.$;
            var lengthEl = $('length');
            var lengthValEl = $('length-val');
            var setUpperEl = $('set-upper');
            var setLowerEl = $('set-lower');
            var setDigitEl = $('set-digit');
            var setSymbolEl = $('set-symbol');
            var excludeSimilarEl = $('exclude-similar');
            var pwdDisplay = $('pwd-display');
            var strengthFill = $('strength-fill');
            var strengthLabel = $('strength-label');
            var entropyEl = $('entropy');
            var charsetSizeEl = $('charset-size');
            var historyListEl = $('history-list');
            var HISTORY_KEY = 'password_generator_history';
            var HISTORY_MAX = 5;
            var currentPassword = '';

            var UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            var LOWER = 'abcdefghijklmnopqrstuvwxyz';
            var DIGITS = '0123456789';
            var SYMBOLS = '!@#$%^&*()_+-=[]{}|;:,.<>?';
            var SIMILAR = '0O1lI';

            function secureRandomInt(max) {
                if (max <= 0) return 0;
                if (max === 1) return 0;
                var buf = new Uint32Array(1);
                var limit = Math.floor(0xFFFFFFFF / max) * max;
                // rejection sampling to avoid modulo bias
                while (true) {
                    window.crypto.getRandomValues(buf);
                    if (buf[0] < limit) return buf[0] % max;
                }
            }

            function shuffle(arr) {
                for (var i = arr.length - 1; i > 0; i--) {
                    var j = secureRandomInt(i + 1);
                    var tmp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = tmp;
                }
                return arr;
            }

            function buildCharsets() {
                var sets = [];
                if (setUpperEl.checked) sets.push(UPPER);
                if (setLowerEl.checked) sets.push(LOWER);
                if (setDigitEl.checked) sets.push(DIGITS);
                if (setSymbolEl.checked) sets.push(SYMBOLS);
                if (sets.length === 0) return { sets: [], pool: '' };

                if (excludeSimilarEl.checked) {
                    var excludeSet = {};
                    SIMILAR.split('').forEach(function (c) { excludeSet[c] = true; });
                    sets = sets.map(function (s) {
                        return s.split('').filter(function (c) { return !excludeSet[c]; }).join('');
                    }).filter(function (s) { return s.length > 0; });
                }
                // combined pool with unique chars
                var seen = {};
                var pool = '';
                sets.forEach(function (s) {
                    s.split('').forEach(function (c) {
                        if (!seen[c]) { seen[c] = true; pool += c; }
                    });
                });
                return { sets: sets, pool: pool };
            }

            function pickCharFrom(str) {
                return str.charAt(secureRandomInt(str.length));
            }

            function generate() {
                Tools.clearBanner('banner-container');
                var cs = buildCharsets();
                if (cs.pool.length === 0) {
                    Tools.showBanner('banner-container', 'warn', '请至少选择一个字符集');
                    pwdDisplay.textContent = '请至少选择一个字符集';
                    pwdDisplay.classList.add('empty');
                    currentPassword = '';
                    updateStrength(0, 0);
                    return;
                }
                var len = parseInt(lengthEl.value, 10) || 16;
                if (len < 4) len = 4;
                if (len > 64) len = 64;

                var chars = [];
                // ensure at least one char from each selected set
                cs.sets.forEach(function (s) {
                    if (chars.length < len) chars.push(pickCharFrom(s));
                });
                // fill the rest
                while (chars.length < len) {
                    chars.push(pickCharFrom(cs.pool));
                }
                // Fisher-Yates shuffle
                shuffle(chars);
                currentPassword = chars.join('');

                pwdDisplay.textContent = currentPassword;
                pwdDisplay.classList.remove('empty');
                updateStrength(len, cs.pool.length);
                saveHistory(currentPassword);
            }

            function updateStrength(len, charsetSize) {
                var entropy = charsetSize > 0 ? len * Math.log2(charsetSize) : 0;
                entropyEl.textContent = entropy.toFixed(1);
                charsetSizeEl.textContent = charsetSize;
                var pct = Math.min(100, (entropy / 100) * 100);
                var level, label, cls;
                if (entropy < 40) { level = '弱'; label = '弱'; cls = 'weak'; }
                else if (entropy < 60) { level = '中'; label = '中'; cls = 'medium'; }
                else if (entropy < 80) { level = '强'; label = '强'; cls = 'strong'; }
                else { level = '非常强'; label = '非常强'; cls = 'very-strong'; }
                strengthFill.className = 'strength-fill ' + cls;
                strengthFill.style.width = pct + '%';
                strengthLabel.className = 'strength-label ' + cls;
                strengthLabel.textContent = charsetSize === 0 ? '—' : label;
            }

            function loadHistory() {
                try {
                    var raw = localStorage.getItem(HISTORY_KEY);
                    if (!raw) return [];
                    var arr = JSON.parse(raw);
                    return Array.isArray(arr) ? arr : [];
                } catch (e) { return []; }
            }

            function saveHistory(pwd) {
                if (!pwd) return;
                var items = loadHistory();
                if (items.length > 0 && items[0].password === pwd) return;
                items.unshift({ password: pwd, time: Date.now() });
                if (items.length > HISTORY_MAX) items = items.slice(0, HISTORY_MAX);
                try { localStorage.setItem(HISTORY_KEY, JSON.stringify(items)); } catch (e) { }
                renderHistory();
            }

            function clearHistory() {
                try { localStorage.removeItem(HISTORY_KEY); } catch (e) { }
                renderHistory();
            }

            function renderHistory() {
                var items = loadHistory();
                historyListEl.innerHTML = '';
                if (items.length === 0) {
                    var empty = Tools.el('div', { class: 'tool-hint', text: '暂无历史记录' });
                    historyListEl.appendChild(empty);
                    return;
                }
                items.forEach(function (it) {
                    var timeStr = new Date(it.time).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    var pwdSpan = Tools.el('span', { class: 'pwd', text: it.password });
                    var timeSpan = Tools.el('span', { class: 'time', text: timeStr });
                    var copyBtn = Tools.el('button', {
                        class: 'btn btn-ghost btn-sm', type: 'button', text: '复制', onclick: function () {
                            Tools.copyText(it.password, copyBtn, '已复制');
                        }
                    });
                    historyListEl.appendChild(Tools.el('div', { class: 'history-item' }, [pwdSpan, timeSpan, copyBtn]));
                });
            }

            // events
            lengthEl.addEventListener('input', function () {
                lengthValEl.textContent = lengthEl.value;
            });
            lengthEl.addEventListener('change', generate);
            [setUpperEl, setLowerEl, setDigitEl, setSymbolEl, excludeSimilarEl].forEach(function (el) {
                el.addEventListener('change', generate);
            });
            $('btn-generate').addEventListener('click', generate);
            $('btn-copy').addEventListener('click', function () {
                if (!currentPassword) {
                    Tools.showBanner('banner-container', 'warn', '请先生成密码');
                    return;
                }
                Tools.copyText(currentPassword, this, '已复制');
            });
            $('btn-clear-history').addEventListener('click', clearHistory);

            renderHistory();
            generate();
        });
    </script>
</body>

</html>
