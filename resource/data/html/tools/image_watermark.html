<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片水印</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./style.css">
    <style>
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
            background: var(--bg-muted);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: var(--bg-muted);
        }

        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .upload-icon {
            font-size: 36px;
            opacity: 0.5;
            margin-bottom: 0.5rem;
        }

        .upload-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.25rem;
        }

        .upload-subtitle {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .range-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .range-row input[type="range"] {
            flex: 1;
        }

        .range-value {
            min-width: 3rem;
            text-align: right;
            font-size: 0.8125rem;
            color: var(--text);
            font-weight: 600;
        }

        .color-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .color-row input[type="color"] {
            width: 40px;
            height: 36px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .color-row input[type="text"] {
            flex: 1;
        }

        .pos-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.375rem;
        }

        .pos-btn {
            padding: 0.5rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.15s;
            text-align: center;
        }

        .pos-btn:hover {
            border-color: var(--primary);
            color: var(--text);
        }

        .pos-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .pos-btn-full {
            grid-column: span 3;
        }

        .preview-box {
            background: var(--bg-muted);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1rem;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 480px;
            object-fit: contain;
        }

        .preview-box .placeholder {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .section {
            margin-bottom: 1rem;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text);
            margin: 0 0 0.5rem;
        }
    </style>
</head>

<body>
    <div class="tool-page">

        <div id="msg-banner"></div>

        <div class="tool-card" style="margin-bottom: 1.5rem;">
            <h2>选择图片</h2>
            <div id="upload-area" class="upload-area">
                <div class="upload-icon">💧</div>
                <div class="upload-title">拖拽图片到此处或点击上传</div>
                <div class="upload-subtitle">支持 JPEG / PNG / WebP 格式</div>
            </div>
            <input type="file" id="file-input" accept="image/*" style="display:none;">
            <ul class="tool-result-list" id="file-info" style="margin-top: 0.5rem;">
                <li><span class="label">文件名</span><span class="value" id="info-name">—</span></li>
                <li><span class="label">尺寸</span><span class="value" id="info-dims">—</span></li>
                <li><span class="label">原始大小</span><span class="value" id="info-size">—</span></li>
            </ul>
        </div>

        <div class="tool-grid-2">
            <div class="tool-card">
                <h2>水印设置</h2>

                <div class="section">
                    <label class="tool-label">水印文字</label>
                    <input type="text" id="wm-text" class="tool-input" value="极速箱水印" maxlength="50">
                </div>

                <div class="section">
                    <label class="tool-label">字号 <span id="font-size-value" class="range-value">24 px</span></label>
                    <div class="range-row">
                        <input type="range" id="font-size" min="12" max="72" step="1" value="24">
                    </div>
                </div>

                <div class="section">
                    <label class="tool-label">字体</label>
                    <select id="font-family" class="tool-select">
                        <option value="system-ui, -apple-system, sans-serif">系统默认</option>
                        <option value="Arial, Helvetica, sans-serif">Arial</option>
                        <option value="'PingFang SC', 'Microsoft YaHei', sans-serif">中文黑体</option>
                        <option value="'SimSun', 'STSong', serif">中文宋体</option>
                        <option value="'Times New Roman', Times, serif">Times New Roman</option>
                        <option value="Georgia, serif">Georgia</option>
                        <option value="'Courier New', monospace">Courier New</option>
                    </select>
                </div>

                <div class="section">
                    <label class="tool-label">字重</label>
                    <select id="font-weight" class="tool-select">
                        <option value="normal">Normal</option>
                        <option value="bold" selected>Bold</option>
                    </select>
                </div>

                <div class="section">
                    <label class="tool-label">颜色</label>
                    <div class="color-row">
                        <input type="color" id="wm-color" value="#ffffff">
                        <input type="text" id="wm-color-text" class="tool-input" value="#ffffff">
                    </div>
                </div>

                <div class="section">
                    <label class="tool-label">不透明度 <span id="opacity-value" class="range-value">70%</span></label>
                    <div class="range-row">
                        <input type="range" id="opacity" min="0" max="100" step="1" value="70">
                    </div>
                </div>

                <div class="section">
                    <label class="tool-label">旋转角度 <span id="rotation-value" class="range-value">0°</span></label>
                    <div class="range-row">
                        <input type="range" id="rotation" min="-180" max="180" step="1" value="0">
                    </div>
                </div>

                <div class="section">
                    <label class="tool-label">位置</label>
                    <div class="pos-grid" id="pos-grid">
                        <button class="pos-btn" data-pos="top-left">↖ 左上</button>
                        <button class="pos-btn" data-pos="top-center">↑ 上中</button>
                        <button class="pos-btn" data-pos="top-right">↗ 右上</button>
                        <button class="pos-btn" data-pos="middle-left">← 左中</button>
                        <button class="pos-btn active" data-pos="middle-center">● 居中</button>
                        <button class="pos-btn" data-pos="middle-right">→ 右中</button>
                        <button class="pos-btn" data-pos="bottom-left">↙ 左下</button>
                        <button class="pos-btn" data-pos="bottom-center">↓ 下中</button>
                        <button class="pos-btn" data-pos="bottom-right">↘ 右下</button>
                        <button class="pos-btn pos-btn-full" data-pos="tile">▦ 平铺(全图覆盖)</button>
                    </div>
                </div>

                <div class="section">
                    <div style="display: flex; gap: 0.5rem;">
                        <button id="btn-apply" class="btn" style="flex: 1;" disabled>应用水印</button>
                        <button id="btn-reset" class="btn btn-ghost" disabled>重置</button>
                    </div>
                </div>
            </div>

            <div class="tool-card">
                <h2>预览</h2>
                <div class="preview-box" id="preview-box">
                    <div class="placeholder">上传图片后点击「应用水印」</div>
                </div>
                <div class="tool-toolbar" style="margin-top: 1rem;">
                    <div class="spacer"></div>
                    <button id="btn-download" class="btn" disabled>下载图片</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./../api.js"></script>
    <script src="./common.js"></script>
    <script>
        'use strict';
        document.addEventListener('DOMContentLoaded', function () {
            var uploadArea = Tools.$('upload-area');
            var fileInput = Tools.$('file-input');
            var wmText = Tools.$('wm-text');
            var fontSizeInput = Tools.$('font-size');
            var fontSizeValue = Tools.$('font-size-value');
            var fontFamilySel = Tools.$('font-family');
            var fontWeightSel = Tools.$('font-weight');
            var wmColor = Tools.$('wm-color');
            var wmColorText = Tools.$('wm-color-text');
            var opacityInput = Tools.$('opacity');
            var opacityValue = Tools.$('opacity-value');
            var rotationInput = Tools.$('rotation');
            var rotationValue = Tools.$('rotation-value');
            var posGrid = Tools.$('pos-grid');
            var btnApply = Tools.$('btn-apply');
            var btnReset = Tools.$('btn-reset');
            var btnDownload = Tools.$('btn-download');
            var previewBox = Tools.$('preview-box');
            var infoName = Tools.$('info-name');
            var infoDims = Tools.$('info-dims');
            var infoSize = Tools.$('info-size');

            var state = {
                file: null,
                img: null,
                position: 'middle-center',
                resultUrl: null
            };

            function formatSize(bytes) {
                if (!bytes) return '0 B';
                var k = 1024;
                var units = ['B', 'KB', 'MB', 'GB'];
                var i = Math.floor(Math.log(bytes) / Math.log(k));
                return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + units[i];
            }
            function showMsg(type, text) { Tools.showBanner('msg-banner', type, text); }
            function clearMsg() { Tools.clearBanner('msg-banner'); }

            fontSizeInput.addEventListener('input', function () { fontSizeValue.textContent = fontSizeInput.value + ' px'; });
            opacityInput.addEventListener('input', function () { opacityValue.textContent = opacityInput.value + '%'; });
            rotationInput.addEventListener('input', function () { rotationValue.textContent = rotationInput.value + '°'; });

            wmColor.addEventListener('input', function () { wmColorText.value = wmColor.value; });
            wmColorText.addEventListener('input', function () {
                var v = wmColorText.value.trim();
                if (/^#[0-9A-Fa-f]{6}$/.test(v)) wmColor.value = v;
            });

            // Position buttons
            posGrid.querySelectorAll('button[data-pos]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    posGrid.querySelectorAll('button[data-pos]').forEach(function (b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    state.position = btn.getAttribute('data-pos');
                    // Set default rotation for tile mode
                    if (state.position === 'tile' && parseInt(rotationInput.value, 10) === 0) {
                        rotationInput.value = -45;
                        rotationValue.textContent = '-45°';
                    }
                });
            });

            // Upload
            uploadArea.addEventListener('click', function () { fileInput.click(); });
            uploadArea.addEventListener('dragover', function (e) {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });
            uploadArea.addEventListener('dragleave', function (e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
            });
            uploadArea.addEventListener('drop', function (e) {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                var files = e.dataTransfer && e.dataTransfer.files;
                if (files && files.length > 0) handleFile(files[0]);
            });
            fileInput.addEventListener('change', function () {
                if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
            });

            function handleFile(file) {
                clearMsg();
                if (!file.type.startsWith('image/')) {
                    showMsg('error', '请选择图片文件(JPEG / PNG / WebP)');
                    return;
                }
                state.file = file;
                state.resultUrl = null;
                btnDownload.disabled = true;

                infoName.textContent = file.name;
                infoSize.textContent = formatSize(file.size);
                infoDims.textContent = '—';

                var reader = new FileReader();
                reader.onload = function (e) {
                    var img = new Image();
                    img.onload = function () {
                        state.img = img;
                        infoDims.textContent = img.naturalWidth + ' × ' + img.naturalHeight;
                        previewBox.innerHTML = '';
                        previewBox.appendChild(Tools.el('div', { class: 'placeholder', text: '点击「应用水印」生成预览' }));
                        btnApply.disabled = false;
                        btnReset.disabled = false;
                    };
                    img.onerror = function () { showMsg('error', '图片加载失败'); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            function hexToRgba(hex, alpha) {
                var r = parseInt(hex.slice(1, 3), 16);
                var g = parseInt(hex.slice(3, 5), 16);
                var b = parseInt(hex.slice(5, 7), 16);
                return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
            }

            function applyWatermark() {
                if (!state.img) return;
                clearMsg();
                var img = state.img;
                var canvas = document.createElement('canvas');
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                var ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0);

                var text = wmText.value || '水印';
                var fontSize = parseInt(fontSizeInput.value, 10) || 24;
                var fontFamily = fontFamilySel.value;
                var fontWeight = fontWeightSel.value;
                var color = wmColorText.value.trim();
                if (!/^#[0-9A-Fa-f]{6}$/.test(color)) color = '#ffffff';
                var opacity = parseInt(opacityInput.value, 10) / 100;
                var rotation = parseInt(rotationInput.value, 10) || 0;
                var pos = state.position;

                ctx.font = fontWeight + ' ' + fontSize + 'px ' + fontFamily;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = hexToRgba(color, opacity);

                // measure text
                var metrics = ctx.measureText(text);
                var textW = metrics.width;
                var textH = fontSize * 1.2;

                var cw = canvas.width;
                var ch = canvas.height;

                function drawRotated(x, y) {
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(rotation * Math.PI / 180);
                    ctx.fillText(text, -textW / 2, 0);
                    ctx.restore();
                }

                if (pos === 'tile') {
                    // Tile across entire image
                    var spacingX = Math.max(textW * 1.8, fontSize * 6);
                    var spacingY = Math.max(textH * 3, fontSize * 4);
                    for (var y = -spacingY; y < ch + spacingY; y += spacingY) {
                        for (var x = -spacingX; x < cw + spacingX; x += spacingX) {
                            drawRotated(x, y);
                        }
                    }
                } else {
                    var pad = Math.max(10, Math.round(fontSize * 0.5));
                    var x, y;
                    // X coordinate
                    if (pos.indexOf('left') >= 0) x = pad + textW / 2;
                    else if (pos.indexOf('right') >= 0) x = cw - pad - textW / 2;
                    else x = cw / 2; // center
                    // Y coordinate
                    if (pos.indexOf('top') >= 0) y = pad + textH / 2;
                    else if (pos.indexOf('bottom') >= 0) y = ch - pad - textH / 2;
                    else y = ch / 2; // middle
                    drawRotated(x, y);
                }

                if (state.resultUrl) URL.revokeObjectURL(state.resultUrl);
                state.resultUrl = canvas.toDataURL('image/png');
                previewBox.innerHTML = '';
                previewBox.appendChild(Tools.el('img', { src: state.resultUrl, alt: '水印预览' }));
                btnDownload.disabled = false;
            }

            btnApply.addEventListener('click', applyWatermark);

            btnDownload.addEventListener('click', function () {
                if (!state.resultUrl) return;
                var baseName = state.file ? state.file.name.replace(/\.[^/.]+$/, '') : 'image';
                var a = Tools.el('a', { href: state.resultUrl, download: baseName + '.watermarked.png' });
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });

            btnReset.addEventListener('click', function () {
                state.file = null;
                state.img = null;
                if (state.resultUrl) { URL.revokeObjectURL(state.resultUrl); state.resultUrl = null; }
                fileInput.value = '';
                btnApply.disabled = true;
                btnDownload.disabled = true;
                btnReset.disabled = true;
                infoName.textContent = '—';
                infoDims.textContent = '—';
                infoSize.textContent = '—';
                previewBox.innerHTML = '';
                previewBox.appendChild(Tools.el('div', { class: 'placeholder', text: '上传图片后点击「应用水印」' }));
                clearMsg();
            });
        });
    </script>
</body>

</html>
