<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录</title>
    <link rel="stylesheet" href="./../style.css" />
    <script src="./../theme.js"></script>
</head>

<body>
    <div class="auth-page">
        <div class="card auth-card">
            <div class="card-header text-center">
                <div class="card-title text-xl">登录</div>
                <p class="text-muted text-sm mt-2">欢迎回到 Tools</p>
            </div>
            <div class="card-content">
                <form id="login-form" class="space-y-4">
                    <div id="error-box" class="error-box hidden"></div>
                    <div>
                        <label>邮箱</label>
                        <input id="email" type="email" class="input" placeholder="xxx@example.com" required />
                    </div>
                    <div>
                        <label>密码</label>
                        <input id="password" type="password" class="input" placeholder="••••••••" required />
                    </div>
                    <button type="submit" class="btn w-full" id="submit-btn">登录</button>
                </form>
                <div class="text-center text-sm mt-4">
                    <span class="text-muted">还没有账号？</span>
                    <a href="./register">注册</a>
                    <span class="text-muted"> | </span>
                    <a href="./../index.html">返回首页</a>
                </div>
            </div>
        </div>
    </div>

    <script src="./../api.js"></script>
    <script src="./../app.js"></script>
    <script>
        (function () {
            if (App.isAuthenticated()) {
                window.location.href = './../';
                return;
            }

            var form = document.getElementById('login-form');
            var emailEl = document.getElementById('email');
            var passEl = document.getElementById('password');
            var btn = document.getElementById('submit-btn');
            var errBox = document.getElementById('error-box');

            function showError(msg) {
                errBox.textContent = msg;
                errBox.classList.remove('hidden');
            }
            function clearError() { errBox.classList.add('hidden'); }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                clearError();
                btn.disabled = true;
                btn.textContent = '登录中...';

                Api.auth.login(emailEl.value, passEl.value)
                    .then(function (data) {
                        if (data.success) {
                            App.setUser(data.user);
                            return Api.teams.list().then(function (td) {
                                if (td.success && td.teams && td.teams.length) {
                                    App.setTeams(td.teams);
                                    var def = td.teams.find(function (t) { return t.isDefault; }) || td.teams[0];
                                    App.setCurrentTeam(def);
                                }
                                window.location.href = '/';
                            });
                        } else {
                            showError(data.error || '登录失败');
                        }
                    })
                    .catch(function () { showError('登录失败，请稍后重试'); })
                    .then(function () {
                        btn.disabled = false;
                        btn.textContent = '登录';
                    });
            });
        })();
    </script>
</body>

</html>
