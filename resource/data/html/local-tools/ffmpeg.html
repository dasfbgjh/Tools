<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg 视频处理</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./common.css">
    <link rel="stylesheet" href="./ffmpeg.css">
</head>

<body>
    <div class="admin-wrap">
        <div class="lt-head">
            <a class="lt-back" href="./index.html" title="返回工具列表">← 返回</a>
            <div class="lt-head-text" style="flex:1;min-width:0;">
                <h1 class="admin-title">FFmpeg 视频处理</h1>
                <p class="admin-subtitle">调用本地 FFmpeg 进行截取、转换、压缩、批量并行 · 仅本机可访问</p>
            </div>
            <div class="lt-head-actions">
                <button class="btn btn-primary" id="btn-start" disabled>开始任务</button>
                <button class="btn" id="btn-clear-finished">清理已完成</button>
            </div>
        </div>

        <div id="banner"></div>

        <!-- FFmpeg 信息 -->
        <div class="ff-section" style="padding: 0.5rem 0.75rem;">
            <div class="ff-ffinfo" id="ff-info">
                <span class="pill">FFmpeg: 检测中...</span>
            </div>
        </div>

        <div class="ff-main">
            <!-- 左：输入与选项 -->
            <div>
                <div class="ff-section">
                    <h2>输入文件</h2>
                    <div class="ff-toolbar" style="margin-bottom: 0.375rem;">
                        <button class="btn btn-outline btn-sm" id="btn-browse-input">浏览添加...</button>
                        <button class="btn btn-ghost btn-sm" id="btn-clear-input">清空</button>
                    </div>
                    <div class="ff-file-list" id="input-list">
                        <div class="empty">未选择文件</div>
                    </div>

                    <h2>输出目录</h2>
                    <div class="ff-dir-row">
                        <input type="text" class="br-input" id="output-dir" placeholder="留空则输出到原文件目录">
                        <button class="btn btn-outline btn-sm" id="btn-browse-output">浏览...</button>
                    </div>
                </div>

                <div class="ff-section">
                    <h2>处理操作 <span class="ff-hint" style="font-weight:400;">（可多选组合）</span></h2>

                    <!-- 截取 -->
                    <div class="ff-op">
                        <label class="ff-op-head">
                            <input type="checkbox" class="ff-op-en" data-op="trim" checked>
                            <span>截取</span>
                        </label>
                        <div class="ff-op-body" data-op-body="trim">
                            <div class="br-row" style="gap:0.5rem;">
                                <div style="flex:1;">
                                    <label class="br-label">开始时间</label>
                                    <input type="text" class="br-input" id="trim-start" placeholder="如 30 或 00:00:30">
                                </div>
                            </div>
                            <div class="br-row" style="gap:0.5rem; align-items: flex-end;">
                                <div style="flex:0 0 auto; min-width: 9.5rem;">
                                    <label class="br-label">结束方式</label>
                                    <select class="br-input" id="trim-end-mode">
                                        <option value="to">时间点（到 ...）</option>
                                        <option value="tail">距离结尾（往前 N 秒）</option>
                                    </select>
                                </div>
                                <div style="flex:1; min-width: 0;">
                                    <label class="br-label" id="trim-end-label">结束时间</label>
                                    <input type="text" class="br-input" id="trim-end"
                                        placeholder="如 30 或 00:00:30（留空到末尾）"
                                        style="width:100%; box-sizing: border-box;">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 格式转换 -->
                    <div class="ff-op">
                        <label class="ff-op-head">
                            <input type="checkbox" class="ff-op-en" data-op="convert">
                            <span>格式转换</span>
                        </label>
                        <div class="ff-op-body" data-op-body="convert" hidden>
                            <label class="br-label">目标格式</label>
                            <select class="br-input" id="convert-format">
                                <option value="mp4">MP4</option>
                                <option value="mkv">MKV</option>
                                <option value="webm">WebM</option>
                                <option value="mov">MOV</option>
                                <option value="avi">AVI</option>
                                <option value="flv">FLV</option>
                                <option value="gif">GIF</option>
                                <option value="mp3">MP3（仅音频）</option>
                                <option value="m4a">M4A（仅音频）</option>
                                <option value="wav">WAV（仅音频）</option>
                            </select>
                        </div>
                    </div>

                    <!-- 压缩 -->
                    <div class="ff-op">
                        <label class="ff-op-head">
                            <input type="checkbox" class="ff-op-en" data-op="compress">
                            <span>压缩</span>
                        </label>
                        <div class="ff-op-body" data-op-body="compress" hidden>
                            <p class="ff-hint">按原文件大小百分比设置输出大小（视频流；音频可选比特率）</p>
                            <label class="br-label">目标大小：<span id="compress-pct-val">100</span>%</label>
                            <div style="display: flex; align-items: center; gap: 0.5rem;">
                                <input type="range" id="compress-pct" min="5" max="200" value="50" style="flex:1;">
                                <span id="compress-pct-num"
                                    style="font-family: ui-monospace, monospace; min-width: 3rem; text-align: right; font-size: 0.75rem; color: var(--text-muted);">50%</span>
                            </div>
                            <div class="br-row" style="margin-top: 0.5rem;">
                                <label class="br-label">音频比特率</label>
                                <select class="br-input" id="compress-audio-bitrate">
                                    <option value="64">64 kbps</option>
                                    <option value="96">96 kbps</option>
                                    <option value="128" selected>128 kbps（默认）</option>
                                    <option value="192">192 kbps</option>
                                    <option value="256">256 kbps</option>
                                    <option value="320">320 kbps</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="ff-section">
                    <h2>设置</h2>
                    <div class="br-row" style="margin-bottom: 0.5rem;">
                        <label
                            style="display:flex; align-items:center; gap:0.375rem; font-size:0.75rem; cursor:pointer; user-select:none;">
                            <input type="checkbox" id="opt-gpu-enable">
                            <span>启用 GPU 加速（关闭后强制使用软件编码 libx264）</span>
                        </label>
                    </div>
                    <label class="br-label">视频编码器</label>
                    <select class="br-input" id="opt-encoder">
                        <option value="auto">自动选择（按可用顺序：NVENC > QSV > AMF > libx264）</option>
                    </select>
                    <div class="br-row" style="gap:0.5rem; margin-top: 0.5rem;">
                        <div style="flex:1;">
                            <label class="br-label">并行任务数</label>
                            <input type="number" class="br-input" id="opt-parallel" min="1" max="16" value="1">
                        </div>
                        <div style="flex:1;">
                            <label class="br-label">每任务 CPU 线程</label>
                            <input type="number" class="br-input" id="opt-threads" min="0" max="64" value="0"
                                placeholder="0=自动">
                        </div>
                    </div>
                    <p class="ff-hint">提示：并行任务较多时建议把每任务 CPU 线程设为 0（自动）</p>
                </div>
            </div>

            <!-- 右：任务列表 -->
            <div>
                <div class="ff-section">
                    <h2>任务列表</h2>
                    <div class="ff-task-list" id="task-list">
                        <div
                            style="font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.75rem;">
                            暂无任务</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../app.js"></script>
    <script src="../api.js"></script>
    <script src="../fs_browser.js"></script>
    <script src="./ffmpeg.js"></script>
</body>

</html>
