<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片标注工具</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="image_annotator.css">
    <script src="../theme.js"></script>
    <script src="common.js"></script>
</head>
<body>
    <div class="annotator-container">
        <div class="app-topbar">
            <div class="topbar-left">
                <a href="index.html" class="lt-back">
                    <svg viewBox="0 0 24 24" width="14" height="14"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <span>返回</span>
                </a>
                <div class="topbar-title">
                    <h2>图片标注工具</h2>
                    <p>调整抠图区域，在选区内绘制标注并导出</p>
                </div>
            </div>
            <div class="topbar-right">
                <div class="topbar-info hidden" id="topbarInfo">
                    <span class="info-chip" id="imageSize">0 × 0</span>
                    <span class="info-chip" id="fileSize">0 KB</span>
                    <span class="info-chip primary-chip" id="selectionInfo">选区: -</span>
                </div>
                <div class="topbar-zoom hidden" id="topbarZoom">
                    <button class="icon-btn" id="zoomOut" title="缩小">
                        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <span class="zoom-label" id="zoomLevel">100%</span>
                    <button class="icon-btn" id="zoomIn" title="放大">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <button class="text-btn" id="zoomFit" title="适应窗口">适应</button>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <div class="drop-zone" id="dropZone">
                <div class="drop-content">
                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    <p>点击选择图片或拖拽图片到此处</p>
                    <span class="hint">支持 PNG, JPG, GIF, BMP, WEBP 格式 · Ctrl+滚轮缩放</span>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>
            <div class="image-container" id="imageContainer" style="display:none;">
                <canvas id="mainCanvas"></canvas>
                <canvas id="overlayCanvas"></canvas>
                <textarea id="inPlaceTextInput" class="in-place-text-input" style="display:none;"></textarea>
            </div>

            <div class="selection-box" id="selectionBox">
                <div class="selection-move-area" id="selectionMoveArea" title="移动工作区"></div>
                <div class="selection-handle nw" data-handle="nw"></div>
                <div class="selection-handle n" data-handle="n"></div>
                <div class="selection-handle ne" data-handle="ne"></div>
                <div class="selection-handle e" data-handle="e"></div>
                <div class="selection-handle se" data-handle="se"></div>
                <div class="selection-handle s" data-handle="s"></div>
                <div class="selection-handle sw" data-handle="sw"></div>
                <div class="selection-handle w" data-handle="w"></div>
            </div>

            <div class="floating-toolbar" id="floatingToolbar">
                <div class="toolbar-row">
                    <div class="toolbar-drag-handle" id="toolbarDragHandle" title="拖动工具栏">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg>
                    </div>
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="select" title="选择移动">
                            <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="rectangle" title="矩形">
                            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="circle" title="圆形">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="arrow" title="箭头">
                            <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="line" title="直线">
                            <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="2"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="pen" title="画笔">
                            <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="text" title="文本">
                            <svg viewBox="0 0 24 24"><text x="6" y="18" font-size="14" font-weight="bold" fill="currentColor">T</text></svg>
                        </button>
                        <button class="tool-btn" data-tool="blur" title="模糊">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor" opacity="0.3"/><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1" opacity="0.5"/></svg>
                        </button>
                        <button class="tool-btn" data-tool="eraser" title="擦除">
                            <svg viewBox="0 0 24 24"><path d="M20 20H7L3 16l9-9 8 8-4 4"/><path d="M6.5 13.5L11 9"/></svg>
                        </button>
                    </div>
                    <div class="tool-group stroke-color-group">
                        <label class="color-label">描边</label>
                        <div class="color-indicator" title="描边颜色（含透明度）">
                            <div class="color-indicator__overlay" id="strokeColorOverlay"></div>
                            <input type="color" id="strokeColor" value="#ff0000" aria-label="描边颜色">
                        </div>
                        <div class="alpha-control">
                            <input type="range" id="strokeAlpha" min="0" max="100" value="100">
                            <span id="strokeAlphaValue" title="不透明度">100%</span>
                        </div>
                    </div>
                </div>

                <div class="toolbar-row">
                    <div class="tool-group fill-color-group">
                        <label class="color-label">填充</label>
                        <div class="color-indicator" title="填充颜色（含透明度）">
                            <div class="color-indicator__overlay" id="fillColorOverlay"></div>
                            <input type="color" id="fillColor" value="#ffffff" aria-label="填充颜色">
                        </div>
                        <div class="alpha-control">
                            <input type="range" id="fillAlpha" min="0" max="100" value="0">
                            <span id="fillAlphaValue" title="不透明度">0%</span>
                        </div>
                    </div>
                    <div class="tool-group">
                        <div class="size-selector">
                            <label>粗细:</label>
                            <input type="range" id="strokeWidth" min="1" max="20" value="3">
                            <span id="strokeWidthValue">3</span>
                        </div>
                        <div class="font-selector" id="fontSelector" style="display:none;">
                            <select id="fontFamily">
                                <option value="Arial">Arial</option>
                                <option value="SimHei">黑体</option>
                                <option value="Microsoft YaHei">微软雅黑</option>
                                <option value="Consolas">Consolas</option>
                                <option value="Courier New">Courier New</option>
                            </select>
                            <input type="number" id="fontSize" min="12" max="72" value="24">
                        </div>
                    </div>
                    <div class="tool-group">
                        <button class="action-btn" id="undoBtn" title="撤销" disabled>
                            <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 0 1 5 5v2M3 10l5-5M3 10l5 5"/></svg>
                        </button>
                        <button class="action-btn" id="redoBtn" title="重做" disabled>
                            <svg viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 0 0-5 5v2M21 10l-5-5M21 10l-5 5"/></svg>
                        </button>
                        <button class="action-btn" id="clearBtn" title="清除标注">
                            <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
                        </button>
                    </div>
                    <div class="tool-group no-divider">
                        <button class="action-btn" id="newImageBtn" title="选择新图片">
                            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                        </button>
                        <button class="action-btn primary" id="saveBtn" title="保存">
                            <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="image_annotator.js"></script>
</body>
</html>
