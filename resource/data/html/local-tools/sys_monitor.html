<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统监测</title>
    <link rel="stylesheet" href="../style.css">
    <script src="./../theme.js"></script>
    <link rel="stylesheet" href="./common.css">
    <link rel="stylesheet" href="./sys_monitor.css">
</head>

<body>
    <div class="sm-page">
        <!-- 顶栏：标题 + 实时统计 + 控制 -->
        <header class="sm-topbar">
            <div class="sm-topbar-left">
                <div class="sm-logo">
                    <span class="sm-logo-pulse"></span>
                    <span class="sm-logo-icon">📊</span>
                </div>
                <div class="sm-title">
                    <h1>系统监测</h1>
                    <span class="sm-sub">实时硬件 / CPU / 内存 / 磁盘</span>
                </div>
            </div>
            <div class="sm-topbar-stats" id="sm-stats">
                <div class="sm-stat" data-key="host"><span class="sm-stat-k">主机</span><span class="sm-stat-v" id="sm-stat-host">-</span></div>
                <div class="sm-stat" data-key="os"><span class="sm-stat-k">系统</span><span class="sm-stat-v" id="sm-stat-os">-</span></div>
                <div class="sm-stat" data-key="cores"><span class="sm-stat-k">核心</span><span class="sm-stat-v" id="sm-stat-cores">-</span></div>
                <div class="sm-stat" data-key="mem"><span class="sm-stat-k">内存</span><span class="sm-stat-v" id="sm-stat-mem">-</span></div>
                <div class="sm-stat" data-key="time"><span class="sm-stat-k">时间</span><span class="sm-stat-v" id="sm-stat-time">-</span></div>
            </div>
            <div class="sm-topbar-right">
                <label class="br-toggle sm-toggle">
                    <span>刷新</span>
                    <select class="br-input" id="sm-interval">
                        <option value="1000">1s</option>
                        <option value="2000" selected>2s</option>
                        <option value="5000">5s</option>
                        <option value="10000">10s</option>
                    </select>
                </label>
                <label class="br-toggle sm-toggle">
                    <input type="checkbox" id="sm-auto" checked>
                    <span>自动</span>
                </label>
                <button class="btn btn-outline btn-sm" id="sm-btn-refresh" title="立即刷新">↻</button>
            </div>
        </header>

        <div id="sm-banner"></div>

        <!-- 仪表盘主体：CSS Grid 单屏布局 -->
        <div class="sm-grid">
            <!-- CPU 实时 -->
            <section class="sm-card sm-cpu">
                <div class="sm-card-head">
                    <h2><span class="sm-dot sm-dot-cpu"></span>CPU</h2>
                    <span class="sm-card-sub" id="sm-cpu-sub">—</span>
                </div>
                <div class="sm-card-body sm-cpu-body">
                    <div class="sm-gauge">
                        <div class="sm-gauge-num" id="sm-cpu-overall">--%</div>
                        <div class="sm-gauge-meta" id="sm-cpu-meta">-</div>
                    </div>
                    <div class="sm-bar sm-bar-lg">
                        <div class="sm-bar-fill" id="sm-cpu-bar" style="width:0%"></div>
                    </div>
                    <div class="sm-thread-grid" id="sm-cpu-threads"></div>
                </div>
            </section>

            <!-- 内存实时 -->
            <section class="sm-card sm-ram">
                <div class="sm-card-head">
                    <h2><span class="sm-dot sm-dot-ram"></span>内存</h2>
                    <span class="sm-card-sub" id="sm-ram-sub">—</span>
                </div>
                <div class="sm-card-body sm-ram-body">
                    <div class="sm-gauge">
                        <div class="sm-gauge-num" id="sm-ram-used">--</div>
                        <div class="sm-gauge-meta" id="sm-ram-used-pct">-</div>
                    </div>
                    <div class="sm-bar sm-bar-lg">
                        <div class="sm-bar-fill" id="sm-ram-bar" style="width:0%"></div>
                    </div>
                    <div class="sm-ram-meta" id="sm-ram-meta">-</div>
                </div>
            </section>

            <!-- 硬件 / 系统（tabs） -->
            <section class="sm-card sm-hw">
                <div class="sm-card-head">
                    <h2><span class="sm-dot sm-dot-hw"></span>硬件 / 系统</h2>
                    <div class="sm-tabs" id="sm-tabs">
                        <button class="sm-tab active" data-tab="os">系统</button>
                        <button class="sm-tab" data-tab="board">主板</button>
                        <button class="sm-tab" data-tab="cpu">CPU</button>
                        <button class="sm-tab" data-tab="memory">内存</button>
                        <button class="sm-tab" data-tab="disks">磁盘</button>
                        <button class="sm-tab" data-tab="gpus">显卡</button>
                        <button class="sm-tab" data-tab="networks">网络</button>
                        <button class="sm-tab" data-tab="batteries">电池</button>
                    </div>
                </div>
                <div class="sm-card-body sm-hw-body">
                    <div class="sm-tab-panel" id="sm-panel-os"></div>
                    <div class="sm-tab-panel" id="sm-panel-board" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-cpu" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-memory" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-disks" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-gpus" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-networks" hidden></div>
                    <div class="sm-tab-panel" id="sm-panel-batteries" hidden></div>
                </div>
            </section>

            <!-- 磁盘实时占用 -->
            <section class="sm-card sm-disks">
                <div class="sm-card-head">
                    <h2><span class="sm-dot sm-disk-dot"></span>磁盘剩余空间</h2>
                    <span class="sm-card-sub" id="sm-disks-sub">—</span>
                </div>
                <div class="sm-card-body sm-disks-body">
                    <div class="sm-disk-list" id="sm-disks"></div>
                </div>
            </section>
        </div>
    </div>

    <script src="../api.js"></script>
    <script src="./sys_monitor.js"></script>
</body>

</html>
