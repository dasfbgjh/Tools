<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>五子棋</title>
    <link rel="stylesheet" type="text/css" href="index.css">
</head>

<body>
    <div class="game-container">
        <div class="game-header">
            <div class="title">五子棋</div>
            <div class="subtitle">GOMOKU</div>
        </div>

        <div class="setup-panel" id="setupPanel">
            <div class="setup-row">
                <div class="setup-group">
                    <div class="setup-label">⚫ 黑棋</div>
                    <select class="setup-select" id="blackType">
                        <option value="human">人</option>
                        <option value="ai">机器</option>
                    </select>
                </div>
                <div class="setup-group">
                    <div class="setup-label">⚪ 白棋</div>
                    <select class="setup-select" id="whiteType">
                        <option value="human">人</option>
                        <option value="ai">机器</option>
                    </select>
                </div>
            </div>
            <div class="setup-row">
                <div class="setup-group">
                    <div class="setup-label">先手</div>
                    <select class="setup-select" id="firstMove">
                        <option value="black">黑棋先手</option>
                        <option value="white">白棋先手</option>
                    </select>
                </div>
                <div class="setup-group">
                    <div class="setup-label">AI 难度</div>
                    <select class="setup-select" id="aiLevel">
                        <option value="easy">简单</option>
                        <option value="medium" selected>中等</option>
                        <option value="hard">困难</option>
                    </select>
                </div>
            </div>
            <button class="start-btn" id="startBtn" onclick="startGame()">开始游戏</button>
        </div>

        <div class="game-body" id="gameBody" style="display:none;">
            <div class="left-panel">
                <div class="player-card" id="blackCard">
                    <div class="player-stone black-stone"></div>
                    <div class="player-info">
                        <div class="player-name" id="blackName">黑棋</div>
                        <div class="player-type" id="blackTypeLabel">人</div>
                    </div>
                    <div class="turn-indicator" id="blackTurn"></div>
                </div>
                <div class="player-card" id="whiteCard">
                    <div class="player-stone white-stone"></div>
                    <div class="player-info">
                        <div class="player-name" id="whiteName">白棋</div>
                        <div class="player-type" id="whiteTypeLabel">人</div>
                    </div>
                    <div class="turn-indicator" id="whiteTurn"></div>
                </div>
                <div class="info-box">
                    <div class="info-label">步数</div>
                    <div class="info-value" id="moveCount">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">用时</div>
                    <div class="info-value" id="timeDisplay">00:00</div>
                </div>
                <button class="action-btn" onclick="undoMove()">悔棋</button>
                <button class="action-btn" onclick="resetToSetup()">返回设置</button>
            </div>

            <div class="board-wrapper">
                <canvas id="boardCanvas"></canvas>
                <div class="board-overlay" id="boardOverlay" style="display:none;">
                    <div class="overlay-content">
                        <div class="overlay-title" id="overlayTitle">游戏结束</div>
                        <div class="overlay-subtitle" id="overlaySubtitle"></div>
                        <button class="overlay-btn" onclick="resetToSetup()">返回设置</button>
                        <button class="overlay-btn" onclick="restartGame()">再来一局</button>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="history-box">
                    <div class="history-title">落子记录</div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
